<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>probe variants</title></head>
<body style="font:13px/1.6 monospace;padding:16px">
<pre id="out">pending</pre>
<script>
var log = [];
function push(s) { log.push(s); document.getElementById("out").textContent = log.join("\n"); }
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function seedAccount(who, extra) {
  localStorage.clear();
  localStorage.setItem("st_accounts", JSON.stringify([
    { role: "teacher", user: "teacher", pass: "x", name: "李老师", createdAt: 1 },
    { role: "student", user: "student", pass: "x", name: "李同学", createdAt: 2 },
    { role: "student", user: "zhangsan", pass: "x", name: "张三", createdAt: 3 }
  ]));
  localStorage.setItem("st_current_user", who);
  localStorage.setItem("st_a11y", JSON.stringify({ profile: "standard" }));
  Object.keys(extra || {}).forEach(function (k) { localStorage.setItem(k, extra[k]); });
}

async function probe(name, who, extra) {
  seedAccount(who, extra);
  var f = document.createElement("iframe");
  f.style.cssText = "width:1100px;height:640px;border:1px solid #999";
  f.src = "training-student.html";
  document.body.appendChild(f);
  await new Promise(r => { f.onload = r; });
  const W = f.contentWindow, D = f.contentDocument;
  var errs = [];
  W.addEventListener("error", function (e) { errs.push(e.message + ":" + e.lineno); });
  const btn = D.getElementById("btnNewAct");
  if (!btn) { push(name + " → 没有按钮"); f.remove(); return; }
  btn.click();
  await wait(250);
  const host = D.getElementById("modalHost");
  const opened = host && !host.hidden && !!D.getElementById("mkGoal");
  var after = "-";
  if (opened) {
    D.getElementById("mkGoal").value = "我想搞清楚哈希冲突为什么不能完全避免";
    D.getElementById("mkCreate").click();
    await wait(350);
    after = JSON.stringify((D.getElementById("stList").textContent || "").replace(/\s+/g, " ").trim().slice(0, 50));
  }
  push(name + " → 弹窗=" + (opened ? "开" : "没开") + " 之后列表=" + after + (errs.length ? " 错误=" + errs.join("|") : ""));
  f.remove();
  await wait(120);
}

(async function () {
  // ① 自注册学生，什么都没有
  await probe("①自注册空账号", "student:zhangsan", {});
  // ② 老格式存档（缺 createdBy / 带 skeleton）
  await probe("②老存档", "student:student", {
    "st_activities:student:student": JSON.stringify([
      { id: "act-1", title: "老活动", goal: "老目标", status: "open",
        skeleton: { steps: [{ t: "步骤一" }] }, createdAt: 1700000000000, updatedAt: 1700000000000 }
    ])
  });
  // ③ 存档里有一条坏记录（null）
  await probe("③坏记录", "student:student", {
    "st_activities:student:student": JSON.stringify([null, { id: "act-2", title: "正常活动" }])
  });
})();
</script>
</body></html>
