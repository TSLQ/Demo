<!DOCTYPE html>
<html lang="zh-CN" data-role="student">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实训 — 智课助教</title>
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/shell.css">
<style>
  :root { --font-sans: "Inter", system-ui; }

  /* ---------- 工具条 ---------- */
  .train-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; background: transparent;
    color: var(--muted-foreground); font-family: inherit; font-size: 12.5px;
    padding: 5px 11px; cursor: pointer; transition: background .14s, color .14s, border-color .14s;
  }
  .chip:hover { background: var(--secondary); color: var(--foreground); }
  .chip.on {
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    border-color: color-mix(in srgb, var(--primary) 32%, transparent);
    color: var(--foreground);
  }
  .tb-spacer { flex: 1 1 auto; }
  .tb-meta { font-size: 12.5px; color: var(--muted-foreground); }

  /* ---------- 三栏：列表 / 聊天 / 进度 ---------- */
  /* 这一页是「工作台」而非阅读型文档 → 打破 1160px 版面限制，让三栏有呼吸空间 */
  .page-wrap, .page { max-width: 1680px; }
  .train-grid { display: grid; grid-template-columns: minmax(200px, 240px) minmax(0, 1fr) minmax(260px, 320px); gap: 16px; align-items: start; }
  .train-list { padding: 14px; }
  .train-mid { padding: 16px 18px; min-height: 360px; }
  .train-side { padding: 16px 14px; min-height: 360px; }
  .train-side .blk:last-child { margin-bottom: 0; }
  .tl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .tl-head h3 { margin: 0; font-size: 13px; font-weight: 500; }
  .tl-head span { font-size: 12px; color: var(--muted-foreground); }

  .act-list { display: flex; flex-direction: column; gap: 6px; }
  .act-item {
    display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left;
    border: 1px solid transparent; border-radius: 10px; background: transparent;
    color: var(--foreground); font-family: inherit; cursor: pointer;
    padding: 10px 11px; transition: background .14s, border-color .14s;
  }
  .act-item:hover { background: var(--secondary); }
  .act-item.on {
    background: color-mix(in srgb, var(--primary) 10%, transparent);
    border-color: color-mix(in srgb, var(--primary) 26%, transparent);
  }
  .ai-top { display: flex; align-items: flex-start; gap: 8px; }
  .ai-title { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.45; }
  .ai-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted-foreground); }
  .ai-time { font-size: 11.5px; color: var(--muted-foreground); }
  .list-empty { font-size: 12.5px; line-height: 1.8; color: var(--muted-foreground); }

  /* ---------- 右栏 ---------- */
  .train-pane { padding: 18px; min-height: 320px; }
  .pane-empty { font-size: 13px; line-height: 1.9; color: var(--muted-foreground); }
  .pane-empty p { margin: 0 0 9px; }
  .pane-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ph-main { flex: 1 1 320px; min-width: 0; }
  .pane-title { font-size: 15px; font-weight: 500; line-height: 1.5; }
  .pane-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 12.5px; }
  .muted { color: var(--muted-foreground); font-size: 12.5px; }

  .blk { margin-bottom: 18px; }
  .blk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .blk-head h3 { margin: 0; font-size: 13px; font-weight: 500; }
  .blk-head .hint { font-size: 12px; color: var(--muted-foreground); }
  .src-line {
    font-size: 12.5px; color: var(--muted-foreground); line-height: 1.7;
    padding: 9px 11px; border-radius: 9px; margin-bottom: 10px;
    background: color-mix(in srgb, var(--primary) 7%, transparent);
  }
  .src-line b { color: var(--foreground); font-weight: 500; }

  /* ---------- 进度条 ---------- */
  .prog-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .prog-track { flex: 1 1 auto; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .prog-fill { height: 100%; background: var(--success); transition: width .25s; }
  .prog-label { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }

  /* ---------- 骨架步骤 ---------- */
  .stage { border: 1px solid var(--border); border-radius: 11px; padding: 12px; margin-bottom: 9px; }
  .stage.done { border-left: 3px solid var(--success); background: color-mix(in srgb, var(--success) 5%, transparent); }
  .stage.now { border-left: 3px solid var(--primary); background: color-mix(in srgb, var(--primary) 7%, transparent); }
  .stage-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .stage-no {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--foreground);
  }
  .stage.done .stage-no { background: var(--success); color: #fff; }
  .stage-title { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 500; }
  .stage-flag { flex: 0 0 auto; font-size: 11.5px; }
  .stage-flag.done { color: var(--success); }
  .stage-flag.now { color: var(--primary); }
  .stage-f { display: block; margin-top: 8px; }
  .stage-f > span { display: block; font-size: 11.5px; color: var(--muted-foreground); margin-bottom: 4px; }
  .stage-f .txt { font-size: 13px; line-height: 1.7; }
  .stage-act { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- 路线笔记 / 新发现 ---------- */
  .notes { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .note { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; }
  .note .n-top { font-size: 11.5px; color: var(--muted-foreground); margin-bottom: 4px; }
  .note .n-text { font-size: 12.5px; line-height: 1.7; margin: 0; }
  .note-form { display: flex; gap: 8px; align-items: flex-start; }
  .note-form .textarea { flex: 1 1 auto; min-height: 42px; font-size: 12.5px; }

  .findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .finding { border: 1px solid var(--border); border-left-width: 3px; border-radius: 10px; padding: 10px 11px; }
  .finding.pinned { border-left-color: var(--success); background: color-mix(in srgb, var(--success) 7%, transparent); }
  .f-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; font-size: 12.5px; }
  .f-text { margin: 0; font-size: 12.5px; line-height: 1.7; }
  .find-form { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
  .find-form .textarea { flex: 1 1 auto; min-height: 42px; font-size: 12.5px; }

  /* ---------- 猜想验证 ---------- */
  .guess-list { display: flex; flex-direction: column; gap: 10px; }
  .guess-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; }
  .guess-q { font-size: 13px; line-height: 1.7; margin: 0 0 8px; }
  .guess-q b { color: var(--primary); font-weight: 500; }
  .guess-a { font-size: 12.5px; line-height: 1.75; margin: 0; }
  .guess-a p { margin: 0 0 6px; }
  .guess-a h4 { margin: 9px 0 4px; font-size: 12.5px; font-weight: 500; }
  .guess-a ul { margin: 0 0 6px; padding-left: 18px; }
  .guess-a code { background: var(--secondary); padding: 0 4px; border-radius: 4px; font-size: 12px; }
  .guess-a pre { background: var(--secondary); padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
  .guess-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted-foreground); margin-top: 8px; }
  .guess-meta a { color: var(--primary); text-decoration: none; }
  .guess-meta a:hover { text-decoration: underline; }
  .guess-form { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
  .guess-form .textarea { flex: 1 1 auto; min-height: 56px; font-size: 12.5px; }
  .guess-busy { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted-foreground); }
  .guess-busy .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: guess-blink 1s infinite; }
  @keyframes guess-blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  /* ---------- 讨论区（群聊） ---------- */
  .chat-log { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; padding-right: 2px; }
  .msg { display: flex; flex-direction: column; gap: 3px; }
  .msg.me { align-items: flex-end; }
  .msg .m-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted-foreground); }
  .msg .m-meta b { color: var(--foreground); font-weight: 500; }
  .msg .m-bubble {
    display: inline-block; max-width: 84%; padding: 7px 11px; border-radius: 12px;
    font-size: 13px; line-height: 1.65; background: var(--secondary); color: var(--foreground);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.teacher .m-bubble {
    background: color-mix(in srgb, var(--primary) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--primary) 26%, transparent);
  }
  .msg.me .m-bubble { background: color-mix(in srgb, var(--primary) 20%, transparent); }
  .chat-form { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .chat-form .textarea { flex: 1 1 auto; min-height: 40px; font-size: 12.5px; }

  .collab { display: flex; gap: 6px; flex-wrap: wrap; }
  .collab .tag { font-size: 11.5px; }

  /* ---------- 发起弹窗 ---------- */
  .mk-preview { border: 1px solid var(--border); border-radius: 10px; padding: 11px; margin-top: 4px; }
  .mk-src { font-size: 12.5px; line-height: 1.7; color: var(--muted-foreground); margin-bottom: 8px; }
  .mk-src b { color: var(--foreground); font-weight: 500; }
  .mk-steps { display: flex; flex-direction: column; gap: 6px; }
  .mk-step { font-size: 12.5px; line-height: 1.6; }
  .mk-step b { font-weight: 500; }
  .mk-step span { color: var(--muted-foreground); }
  .pick-list { display: flex; flex-direction: column; gap: 5px; max-height: 160px; overflow-y: auto; }
  .pick-list label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; cursor: pointer; }
  .pick-list input { margin: 0; }

  /* 中屏：稍微收窄侧栏，保住中间聊天区 */
  @media (max-width: 1280px) {
    .train-grid { grid-template-columns: 210px minmax(0, 1fr) 280px; gap: 14px; }
  }
  /* 平板：进度栏落到聊天下方（跨整行），列表仍留左边 */
  @media (max-width: 1024px) {
    .train-grid { grid-template-columns: 220px minmax(0, 1fr); }
    .train-side { grid-column: 1 / -1; }
  }
  /* 手机：单栏 */
  @media (max-width: 760px) {
    .page-wrap, .page { max-width: 100%; }
    .train-grid { grid-template-columns: minmax(0, 1fr); }
    .train-side { grid-column: auto; }
  }

  /* 中栏聊天区：占满高度，消息区滚动、输入框贴底 */
  .chat-pane { display: flex; flex-direction: column; min-height: 520px; }
  .chat-pane .chat-log { flex: 1 1 auto; max-height: none; min-height: 200px; }
  .chat-pane .chat-empty { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px 10px; }
  /* 右栏最宽也顶到顶对齐，避免比中栏矮太多留大片空白 */
  .train-side { align-self: start; }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="page" style="padding-top:0">
    <div class="page-head">
      <div class="crumb">学习 · 实训</div>
      <h1>实训</h1>
      <p>跟着一条「路径」重走一遍人类发现它的过程 —— <b>只给路径，不给答案</b>。老师发布的活动在这里参与，你也可以自己发起一个探究。</p>
    </div>

    <div class="card train-bar">
      <div class="chips" id="stFilters"></div>
      <span class="tb-spacer"></span>
      <span class="tb-meta" id="stMeta"></span>
      <button class="btn btn-primary btn-sm" type="button" id="btnNewAct">＋ 发起实训</button>
    </div>

    <div class="train-grid">
      <section class="card train-list">
        <div class="tl-head">
          <h3>实训</h3>
          <span id="stCount">—</span>
        </div>
        <div class="act-list" id="stList"></div>
      </section>

      <section class="card train-pane train-mid chat-pane" id="stChat"></section>

      <section class="card train-side" id="stSide"></section>
    </div>

    <div class="notice notice-info">
      <span aria-hidden="true">◎</span>
      <div>
        <b>为什么是「不给答案，给路径」</b> —— 课程只会讲到结论，但结论是怎么被创造出来的，恰恰是最能学东西的地方。
        所以每一步只给「往哪想」的问题、可查的线索、和一件能动手做的事，结论留给你自己走到。<br>
        <b>诚实说明</b>：纯静态站不能真的联网检索，「检索创造史」这一版固化成了本地路径库（命不命中都会如实标注）。
        协作者与新发现是<b>本机浏览器内</b>的模拟 —— 换一台机器就查不到，正式版由服务端承载。
      </div>
    </div>
  </div>
</div>

<!-- 内容页自己的弹窗宿主（壳的 #modalHost 在 iframe 里取不到） -->
<div id="modalHost" hidden></div>

<script src="assets/nav.js"></script>
<script src="assets/core.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function me() { return (typeof currentUserKey === "function") ? currentUserKey() : ""; }
  function myName() { return (typeof accountDisplayName === "function") ? accountDisplayName(me()) : "我"; }

  /* ---------------- 轻提示（样式在 design.css 的 #flash）---------------- */
  var flashTimer = 0;
  function flash(msg, tone) {
    var box = $("flash");
    if (!box) {
      box = document.createElement("div");
      box.id = "flash";
      document.body.appendChild(box);
    }
    box.className = tone || "";
    box.textContent = msg;
    box.hidden = false;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { box.hidden = true; }, 2800);
  }

  var VIEW = { filter: "all", currentId: "" };

  var FILTERS = [
    { k: "all",  label: "全部"   },
    { k: "open", label: "进行中" },
    { k: "mine", label: "我发起的" },
    { k: "done", label: "已归档" },
  ];

  /* ---------------- 数据读取 ---------------- */
  function mine() {
    return activitiesForStudent(me());
  }

  /** 学生视角的状态标签：直接走统一状态（学生发起即「进行中」） */
  function stLabel(a) {
    return activityStatus(a.status);
  }

  function courseName(id) {
    if (!id) return "";
    if (typeof studentCourseName === "function") {
      var n = studentCourseName(id);
      if (n) return n;
    }
    if (typeof ENROLLED !== "undefined") {
      var e = (ENROLLED || []).filter(function (x) { return x.courseId === id; })[0];
      if (e) return e.name || "";
    }
    return "";
  }

  function visible() {
    var all = mine();
    var u = (me() || "").toLowerCase();
    if (VIEW.filter === "all") return all;
    if (VIEW.filter === "open") return all.filter(function (a) { return a.status === "open"; });
    if (VIEW.filter === "done") return all.filter(function (a) { return a.status === "done"; });
    if (VIEW.filter === "mine") {
      return all.filter(function (a) {
        return a.origin === "student" && String(a.createdBy || "").toLowerCase() === u;
      });
    }
    return all;
  }

  function currentActivity() {
    var list = visible();
    if (VIEW.currentId) {
      var hit = list.filter(function (a) { return a.id === VIEW.currentId; })[0];
      if (hit) return hit;
    }
    return list[0] || null;
  }

  /* ---------------- 渲染：筛选 / 列表 ---------------- */
  function renderFilters() {
    var box = $("stFilters");
    if (!box) return;
    var all = mine();
    box.innerHTML = FILTERS.map(function (f) {
      var n;
      if (f.k === "all") n = all.length;
      else if (f.k === "open") n = all.filter(function (a) { return a.status === "open"; }).length;
      else if (f.k === "done") n = all.filter(function (a) { return a.status === "done"; }).length;
      else {
        var u = (me() || "").toLowerCase();
        n = all.filter(function (a) { return a.origin === "student" && String(a.createdBy || "").toLowerCase() === u; }).length;
      }
      return '<button class="chip' + (VIEW.filter === f.k ? " on" : "") + '" type="button" data-filter="' + f.k +
        '" aria-pressed="' + (VIEW.filter === f.k) + '">' + f.label + " " + n + "</button>";
    }).join("");
  }

  function renderMeta() {
    var meta = $("stMeta");
    if (meta) meta.textContent = "共 " + mine().length + " 条实训";
    var count = $("stCount");
    if (count) {
      var list = visible();
      count.textContent = VIEW.filter === "all" ? list.length + " 条" : list.length + " / " + mine().length + " 条";
    }
  }

  function actItemHtml(a) {
    var st = stLabel(a);
    var pill = st.tone === "ok" ? "st-ok" : st.tone === "warn" ? "st-warn" : "";
    var steps = (a.skeleton && a.skeleton.stages) || [];
    var isMine = a.origin === "student" && String(a.createdBy || "").toLowerCase() === (me() || "").toLowerCase();
    return (
      '<button class="act-item' + (a.id === VIEW.currentId ? " on" : "") + '" type="button" data-act-id="' + esc(a.id) +
        '" aria-current="' + (a.id === VIEW.currentId) + '">' +
        '<span class="ai-top">' +
          '<span class="ai-title">' + esc(a.title) + "</span>" +
          '<span class="status-pill ' + pill + '">' + st.label + "</span>" +
        "</span>" +
        '<span class="ai-meta">' +
          '<span class="tag' + (a.origin === "student" ? " tag-warning" : "") + '">' +
            (isMine ? "我发起的" : activityOrigin(a.origin)) + "</span>" +
          "<span>" + steps.length + " 步</span>" +
          (a.participants.length ? "<span>" + a.participants.length + " 人</span>" : "") +
        "</span>" +
        '<span class="ai-time">' + agoText(a.updatedAt, Date.now()) +
          (courseName(a.courseId) ? " · " + esc(courseName(a.courseId)) : "") + "</span>" +
      "</button>"
    );
  }

  function renderList() {
    var box = $("stList");
    if (!box) return;
    var list = visible();
    if (!list.length) {
      box.innerHTML = '<p class="list-empty">' + (VIEW.filter === "all"
        ? "老师还没发布实训。点右上角「＋ 发起实训」，自己写一句想探究的目标，也能发起一个。"
        : "这个状态下没有实训。") + "</p>";
      return;
    }
    box.innerHTML = list.map(actItemHtml).join("");
  }

  /* ---------------- 渲染：右栏（参与视图） ---------------- */
  function progressInfo(a) {
    var p = myProgressOf(a.id);
    var notes = (p && p.notes) || [];
    var ded = (p && p.deductions) || [];
    var findings = a.findings || [];
    var total = notes.length + ded.length + findings.length;
    var pct = Math.min(100, total * 20);          // 5 条成果就满
    var direction = "";
    var latestAt = -1;
    [notes, ded, findings].forEach(function (arr) {
      arr.forEach(function (x) {
        if ((x.at || 0) >= latestAt) { latestAt = x.at || 0; direction = x.text || ""; }
      });
    });
    return { pct: pct, total: total, notes: notes, deductions: ded, findings: findings, direction: direction };
  }

  function ideasHtml(a) {
    var p = myProgressOf(a.id);
    var notes = (p && p.notes) || [];
    var findings = a.findings || [];
    var items = [];
    notes.slice().reverse().forEach(function (n) {
      items.push({ at: n.at, text: n.text, kind: "idea", who: "", pinned: false });
    });
    findings.slice().reverse().forEach(function (f) {
      items.push({ at: f.at, text: f.text, kind: "finding", who: f.who, pinned: f.pinned });
    });
    items.sort(function (x, y) { return (y.at || 0) - (x.at || 0); });

    var list = items.length
      ? '<ul class="notes">' + items.map(function (it) {
          var badge = it.kind === "finding"
            ? '<span class="tag' + (it.pinned ? " tag-success" : "") + '">新发现' + (it.pinned ? " · 老师推荐" : "") + "</span>"
            : '<span class="tag">灵感</span>';
          return '<li class="note">' +
            '<div class="n-top">' + badge + (it.who ? " <b>" + esc(it.who) + "</b>" : "") +

  function courseOptionsHtml() {

          '<button class="btn btn-primary" type="button" id="mkCreate">发起实训</button>' +
        "</div>" +
      "</div>";

    host.hidden = false;

    document.addEventListener("keydown", pageModalEsc);

    $("mkGoal").addEventListener("input", renderPreview);

    $("mkCreate").addEventListener("click", function () {
      var goal = ($("mkGoal").value || "").trim();
      var err = $("mkErr");

      var picked = [];

      var checked = host.querySelectorAll(".pick-list input:checked");
      Array.prototype.forEach.call(checked, function (c) {
        var key = c.value;
        picked.push(key);
        names.push((typeof accountDisplayName === "function") ? accountDisplayName(key) : key.split(":")[1]);
      });

      closeNewAct();

      VIEW.currentId = r.activity.id;
      renderAll();
      flash("已发起，现在就能参与", "ok");

  /* ============================================================
     让 AI 验证猜想（第 50/52 轮）—— 学生写猜想 → AI 查证 → 结论记入「推导信息」
     ------------------------------------------------------------
     🔴 未接模型且未配搜索 → 给「预置示例」结论（source=sample，明确标注）。
     🔴 结论持久化到进度层的 deductions（source=ai/sample），刷新不丢。
     ============================================================ */

  var SAMPLE_ANSWER = [
    "**验证结论** —— 你的前半句是对的：把数组一分为二、各自递归排序、再合并，正是「归并排序（Merge Sort）」的核心思想（分治 + 合并）。但后半句「永远比快排快」不成立。",
    "",
    "#### 可行性 / 关键差异",
    "- 归并排序：稳定、最坏 O(n log n)，但要 O(n) 额外空间",
    "- 快速排序：平均 O(n log n)、原地省空间、缓存友好，但最坏退化到 O(n²)（可用随机化缓解）",
    "- 所以没有「谁永远更快」：取决于数据是否有序、要不要稳定性、内存是否紧张",
    "",
    "#### 依据",
    "这是经典算法教材与标准库实现的共识，例如 C++ 的 std::stable_sort 常基于归并、Java 的 Arrays.sort 对基本类型用双轴快排。",
    "",
    "#### 下一步建议",
    "自己写两组数据实测：① 已排序数组 ② 随机数组，分别计时看谁更快 —— 这比记住结论更有价值。",
  ].join("\n");

  function guessSystemPrompt(withSearch) {
    var lines = [
      "你是一位计算机课程的探究式学习助教。学生在一次「实训」里提出了一个偏离既定引导路径的、自己的猜想或想法。",
      "你的任务是：先验证，再判断可行性，最后回答。",
      "",
      "三步走：",
      "1. 验证：判断这个猜想是否成立、是否已有前人提出过、与已知知识的吻合点与冲突点。",
      "2. 可行性：这个想法能不能走得通？关键难点在哪？值不值得继续？",
      "3. 回答：给出「验证结论 + 可行性判断 + 依据 + 下一步建议」。",
    ];
    if (withSearch) {
      lines.push(
        "",
        "## 硬性要求",
        "1. 只依据「联网检索结果」和你的知识回答，不要编造来源；引用时用 [1][2] 标注，对应结果里的编号。",
        "2. 检索结果不足以定论时，如实说「现有检索结果不足以定论」，并建议学生怎么补充验证。",
        "3. 这是探究式学习，重在过程：可以指出猜想对错方向、解释原理，但不填鸭式下结论。",
        "4. 用中文、Markdown 排版，控制在 350 字以内。"
      );
    } else {
      lines.push(
        "",
        "## 硬性要求",
        "1. 你此刻没有联网，请基于你的知识回答，不要假装检索过，也不要编造具体网址。",
        "2. 可以指出猜想对错方向、解释原理，但不直接下结论，重在引导。",
        "3. 用中文、Markdown 排版，控制在 350 字以内。"
      );
    }
    return lines.join("\n");
  }

  function guessUserPrompt(a, q, results, withSearch) {
    var lines = [
      "学生提出的猜想 / 想法：",
      q,
      "",
      "当前实训主题：",
      (a.title || "") + (a.goal ? " —— " + a.goal : ""),
    ];
    if (withSearch && results && results.length) {
      lines.push("", "联网检索结果（共 " + results.length + " 条）：");
      results.forEach(function (s, i) {
        lines.push("[" + (i + 1) + "] " + s.title + "（" + s.url + "）");
        if (s.snippet) lines.push("    " + s.snippet);
      });
    }
    return lines.join("\n");
  }

  function validateConjecture(a, q) {
    // 猜想本身先存成灵感（「保存的猜想灵感」区能看到）
    if (typeof addRouteNote === "function") addRouteNote(a.id, q);

    var canSearch = (typeof searchReady === "function") && searchReady();
    var canModel = (typeof llmReady === "function") && llmReady();

    if (!canSearch && !canModel) {
      if (typeof addDeduction === "function") addDeduction(a.id, SAMPLE_ANSWER, "sample");
      flash("未接模型 / 未配搜索，先给了预置示例结论", "ok");
      renderSide();
      return;
    }

    var searchP = canSearch
      ? (typeof webSearch === "function" ? webSearch(q) : Promise.resolve({ ok: false, error: "搜索功能未加载" }))
      : Promise.resolve({ ok: false, demo: true, hint: "未配置联网搜索" });

    searchP.then(function (sr) {
      var withSearch = !!(sr && sr.ok && sr.results && sr.results.length);
      var sources = withSearch ? sr.results : [];

      var call = (typeof llmChat === "function"
        ? llmChat(guessSystemPrompt(withSearch), guessUserPrompt(a, q, sources, withSearch), { maxTokens: 1600, temperature: 0.3 })
        : Promise.resolve({ ok: false, error: "模型功能未加载" }));

      return call.then(function (r) {
        if (r && r.ok) {
          if (typeof addDeduction === "function") addDeduction(a.id, r.raw, "ai");
          flash("已验证，结论记入了「推导信息」", "ok");
        } else {
          flash((r && r.error) || "验证失败", "bad");
        }
        renderSide();
      });
    });
  }

  /* ---------------- 起手 ---------------- */
  renderAll();
})();
</script>
</body>
</html>
