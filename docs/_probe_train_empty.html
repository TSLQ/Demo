<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>probe empty submit</title></head>
<body style="font:13px/1.6 monospace;padding:16px">
<pre id="out">pending</pre>
<script>
localStorage.clear();
localStorage.setItem("st_accounts", JSON.stringify([
  { role: "teacher", user: "teacher", pass: "x", name: "李老师", createdAt: 1 },
  { role: "student", user: "student", pass: "x", name: "李同学", createdAt: 2 }
]));
localStorage.setItem("st_current_user", "student:student");
localStorage.setItem("st_a11y", JSON.stringify({ profile: "standard" }));

var log = [];
function push(s) { log.push(s); document.getElementById("out").textContent = log.join("\n"); }
const wait = (ms) => new Promise(r => setTimeout(r, ms));

(async function () {
  var f = document.createElement("iframe");
  f.style.cssText = "width:1200px;height:700px;border:1px solid #999";
  f.src = "training-student.html";
  document.body.appendChild(f);
  await new Promise(r => { f.onload = r; });
  const W = f.contentWindow, D = f.contentDocument;
  W.addEventListener("error", function (e) { push("ERR: " + e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno); });

  D.getElementById("btnNewAct").click();
  await wait(300);
  const host = D.getElementById("modalHost");
  const mk = D.getElementById("mkCreate");
  push("弹窗开=" + !host.hidden + " mkCreate=" + !!mk);

  // ① 空目标直接提交
  mk.click();
  await wait(300);
  const err = D.getElementById("mkErr");
  push("空目标：弹窗还开=" + !host.hidden +
       " err.hidden=" + (err ? err.hidden : "无") +
       " err.display=" + (err ? W.getComputedStyle(err).display : "-") +
       " err文本=" + (err ? JSON.stringify(err.textContent) : "-") +
       " err盒子高=" + (err ? Math.round(err.getBoundingClientRect().height) : "-"));

  // ② 只打空格
  D.getElementById("mkGoal").value = "   ";
  mk.click();
  await wait(200);
  push("空格目标：弹窗还开=" + !host.hidden + " err=" + (err ? JSON.stringify(err.textContent) : "-"));

  // ③ 正常目标
  D.getElementById("mkGoal").value = "我想弄明白：为什么堆排序建堆是 O(n)";
  mk.click();
  await wait(400);
  const listT = D.getElementById("stList").textContent.replace(/\s+/g, " ").trim();
  push("正常目标：弹窗开=" + !host.hidden + " 列表=" + JSON.stringify(listT.slice(0, 70)));
  push("左栏条目数=" + D.querySelectorAll("#stList .act-item, #stList button").length);
})();
</script>
</body></html>
