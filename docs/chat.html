<!DOCTYPE html>
<html lang="zh-CN" data-role="student">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 答疑 — 智课助教</title>
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/shell.css">
<!--
  ============================================================
  课程 AI 答疑
  ------------------------------------------------------------
  🔴 这里**不再有任何预置问答库**（第 65 轮）。
     之前那套 KB + pickReply 是按关键词命中、回 4 段背下来的文字：
     不管学生真问什么，答的都是同一批句子 —— 那不是答疑，是假装答疑。

  现在的规矩（与 reader.html 的「重讲」同一条）：
     · 接了模型 → `llmChat` 现场作答，上下文 = **本课课件正文** + 多轮对话历史
     · 没接模型 → **如实说没接、不给任何假答案**，并给出可点的下一步（去设置页）
     · 超时 / Key 失效 / 内容被拦 → 如实报错，不退回假内容

  数据从哪来：
     · 课程：URL `?course=` → 否则 ENROLLED 第一门
     · 课件：`cwsForStudent(currentUserKey(), courseId)` —— 跨账号桶读老师发的那份
     · 段落：`cwSections(cw)` —— 与教师端、课件阅读页**同一份切段规则**
     · 讲法偏好：`personaPromptBlock()`（由 llmChat 自动拼进 system，来源是行为记录）

  🔴 行为日志（`rec` → `logBehavior`）是「我的学情」与教师端看到的**唯一数据源**：
     提问 / 懂了 / 要了推导·代码·自测 都要记，且**只在真实动作发生时**记。
  ============================================================
-->
<style>
  :root { --font-sans: "Inter", system-ui; }
  /* 气泡操作栏：点过之后给个"已经记下了"的状态（不是装饰，是真的记进了行为日志） */
  .bubble-foot a.on { color: var(--success); cursor: default; }
  .bubble-foot a.on:hover { text-decoration: none; }
  .bubble-foot .foot-hint { color: var(--muted-foreground); }
  /* 右栏画像的脚注：说清数字是从哪儿来的 */
  .profile-meta b { font-weight: 500; color: var(--foreground); }

  /* 🔴 「系统说话」—— 没接模型 / 这次没答上来 / 已停止。
     它不是助教的回答，样式上必须一眼分得清，免得被当成模型输出。 */
  .msg.sys { max-width: 92%; }
  .msg.sys .msg-avatar {
    background: var(--warning-surface); color: var(--warning);
    font-size: 13px; font-weight: 600;
  }
  .msg.sys .bubble {
    background: var(--warning-surface);
    border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent);
    color: var(--foreground);
  }
  .msg.sys .bubble .btn { margin-top: 9px; }

  /* 底栏的模型状态可点（点了去设置页），所以做成按钮而不是一行灰字 */
  .composer-foot button.model-hint {
    border: 0; background: none; padding: 0; font: inherit; cursor: pointer;
    color: var(--primary); text-decoration: underline; text-underline-offset: 2px;
  }
  .composer-foot button.model-hint.off { color: var(--warning); }
  .composer-foot button.model-hint:hover { text-decoration-thickness: 2px; }

  /* 发送中：按钮变成「停止」，形状上要能看出来 */
  .send-btn.stopping { background: var(--destructive); color: #fff; }
</style>
</head>
<body>


<div class="page-wrap">
    <div class="page" style="padding-top:0">
      <div class="page-head" style="margin-bottom:18px">
        <div class="crumb" id="crumbText">—</div>
        <h1>AI 答疑</h1>
        <p>针对当前课程与课件提问 —— 回答由你配置的模型现场生成</p>
      </div>

      <div class="chat-grid">
        <!-- 对话主区 -->
        <section class="card card-raised chat-main" aria-label="对话区">
          <div class="chat-head">
            <div class="msg-avatar" style="background:var(--primary);color:var(--primary-foreground)">智</div>
            <div style="flex:1;min-width:0">
              <h2 id="courseName">—</h2>
              <p id="chatSub">—</p>
            </div>
            <span class="tag" id="modelTag">—</span>
          </div>

          <div class="chat-log" id="chatLog" role="log" aria-live="polite" aria-label="对话记录"></div>

          <div class="chat-suggests" id="suggests"></div>

          <div class="composer">
            <div class="composer-box">
              <label class="sr-only" for="input">输入你的问题</label>
              <textarea id="input" rows="1"
                placeholder="输入你的问题 —— 概念、代码、题目思路都能问"></textarea>
              <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">↑</button>
            </div>
            <div class="composer-foot">
              <span><span class="kbd">Enter</span> 发送　<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</span>
              <button type="button" class="model-hint" id="modelHint">—</button>
            </div>
          </div>
        </section>

        <!-- 风格画像 -->
        <aside class="card card-raised profile-panel" aria-label="讲解风格画像">
          <h3>讲解风格画像</h3>
          <p>系统依据你的阅读与追问行为自动精进（比例的分母是你的提问次数）</p>

          <div id="traits"></div>
          <div class="profile-meta" id="profileMeta"></div>

          <button class="btn btn-sm" style="width:100%" id="resetProfile">重置风格画像</button>
        </aside>
      </div>
    </div>
  </div>

<script src="assets/nav.js"></script>
<script src="assets/core.js"></script>
<script>
/* ============================================================
   当前课堂（?course=xxx）
   ------------------------------------------------------------
   左侧「我的课程」点进来会带 ?course=xxx（见 nav.js 的 refreshStudentCourseNav）。
   🔴 多门课共用本页：不带参数的话，侧栏所有课程项会一起高亮，
      页头也永远显示同一门课 —— 学生加了别的课堂根本看不出来。
   ============================================================ */
const QUERY_COURSE = decodeURIComponent((location.search.match(/[?&]course=([^&]+)/) || [])[1] || "");
const CUR_COURSE_ID = QUERY_COURSE ||
  ((typeof ENROLLED !== "undefined" && ENROLLED[0]) ? ENROLLED[0].courseId : "");
const CUR_NAME = (CUR_COURSE_ID && typeof studentCourseName === "function")
  ? studentCourseName(CUR_COURSE_ID) : "";

const MY_KEY = (typeof currentUserKey === "function") ? currentUserKey() : "";
const MY_NAME = (function () {
  try {
    if (typeof accountNameOf === "function" && MY_KEY) return accountNameOf(MY_KEY) || "我";
  } catch (_) { /* 读不到账号表就退回「我」 */ }
  return "我";
})();

/* ============================================================
   行为记录 —— 页面在**真实动作发生的那一刻**调它
   ------------------------------------------------------------
   这份记录就是「我的学情」和教师端点开学生姓名看到的那些图表的**唯一数据源**：
   学生自己看到的和老师看到的必须一模一样，所以两边都只读这一份。
   ⚠️ 不要为了"让图表好看"补记 —— 记下来的每一条都得对应屏幕上真发生过的动作。
   ============================================================ */
function rec(kind, label, topic) {
  if (typeof logBehavior !== "function") return null;
  return logBehavior({ kind: kind, label: label, topic: topic, courseId: CUR_COURSE_ID });
}

/* ============================================================
   本课课件 —— 模型的参考资料就来自这里
   ------------------------------------------------------------
   🔴 只读**老师真发来的**那份（cwsForStudent 跨账号桶，只认 published）。
      没有课件就是没有 —— 页面上如实说，不拿内置内容冒充本课资料。
   ============================================================ */
function courseCws() {
  if (!CUR_COURSE_ID) return [];
  try {
    if (typeof cwsForStudent !== "function") return [];
    return cwsForStudent(MY_KEY, CUR_COURSE_ID) || [];
  } catch (_) { return []; }
}
function sectionList(cw) {
  try { return (typeof cwSections === "function") ? (cwSections(cw) || []) : []; }
  catch (_) { return []; }
}
const CW_LIST = courseCws();

function chapterTitle() {
  for (let i = 0; i < CW_LIST.length; i++) {
    const ch = CW_LIST[i] && CW_LIST[i].chapters;
    if (ch && ch.length && ch[0] && ch[0].title) return String(ch[0].title);
  }
  return "";
}
function totalSections() {
  return CW_LIST.reduce((n, cw) => n + sectionList(cw).length, 0);
}

/* ---------- 模型接入状态 ---------- */
function modelReadyNow() {
  try { return (typeof llmReady === "function") && !!llmReady(); } catch (_) { return false; }
}
function modelName() {
  try {
    const c = (typeof llmConfig === "function") ? llmConfig() : null;
    if (c && c.cfg) return String(c.cfg.model || c.cfg.label || "");
  } catch (_) { /* 读不到就当没名字 */ }
  return "";
}
function goSettings() {
  try {
    if (typeof navigate === "function") { navigate("settings.html"); return; }
  } catch (_) { /* 落到下面 */ }
  try { location.href = "settings.html"; } catch (_) { /* jsdom / 受限环境 */ }
}

/* 页头三处：面包屑 / 课程名 / 副标题 —— 都要跟着当前课堂走 */
function renderHead() {
  const crumb = $("#crumbText");
  const h2 = $("#courseName");
  const sub = $("#chatSub");

  if (!CUR_COURSE_ID) {
    if (crumb) crumb.textContent = "还没有加入课堂";
    if (h2) h2.textContent = "（未加入课堂）";
    if (sub) sub.textContent = "点左侧「我的课程」右边的 ＋，输入邀请码就能加入课堂";
    return;
  }

  const chap = chapterTitle();
  if (crumb) crumb.textContent = chap ? CUR_NAME + " › " + chap : CUR_NAME;
  if (h2) h2.textContent = CUR_NAME;
  if (sub) {
    sub.textContent = CW_LIST.length
      ? "已加载 " + CW_LIST.length + " 份课件 · " + totalSections() + " 段正文"
      : "本课还没有课件 —— 回答只依据通用知识，涉及本课细节会如实说没有";
  }
}

/* 右上角的接入状态 + 底栏那行可点的提示 */
function renderModelState() {
  const ok = modelReadyNow();
  const nm = modelName();
  const tag = $("#modelTag");
  const hint = $("#modelHint");

  if (tag) {
    tag.className = "tag " + (ok ? "tag-success" : "tag-warning");
    tag.textContent = ok ? ("已接入 " + (nm || "模型")) : "未接模型";
  }
  if (hint) {
    hint.textContent = ok
      ? ("回答由 " + (nm || "你的模型") + " 现场生成 · 点此更换服务商")
      : "还没接模型 · 点这里去接入";
    hint.className = "model-hint" + (ok ? "" : " off");
  }
}

/* ============================================================
   参考资料：从本课课件里挑与这一问最相关的段落
   ------------------------------------------------------------
   为什么不整本塞进去：一份课件几千字，三份就超预算，
   而模型真正需要的只是「这一问相关的那几段」。
   打分只看关键词是否出现在段落里（本地算，不发请求），
   一条都没命中时给课件开头几段当背景 —— 至少让它知道这门课在讲什么。
   ============================================================ */
function pickTerms(text) {
  return String(text || "").toLowerCase()
    .split(/[\s，。？！、；：""''（）()《》〈〉【】,.!?;:/\\|]+/)
    .filter((w) => w.length >= 2);
}
function retrievedFor(text) {
  if (!CW_LIST.length) return "";
  const pool = [];
  CW_LIST.forEach((cw) => {
    const title = String((cw && cw.title) || "课件");
    sectionList(cw).forEach((sec, i) => pool.push({ title: title, no: i + 1, text: sec }));
  });
  if (!pool.length) return "";

  const terms = pickTerms(text);
  const scored = pool.map((p) => {
    const body = p.text.toLowerCase();
    let sc = 0;
    terms.forEach((w) => { if (body.indexOf(w) >= 0) sc += 2; });
    return { p: p, sc: sc };
  });
  scored.sort((a, b) => b.sc - a.sc);

  const picked = scored.filter((x) => x.sc > 0).slice(0, 8).map((x) => x.p);
  // 关键词全没命中 → 给开头几段，而不是什么都不给
  if (!picked.length) pool.slice(0, 6).forEach((p) => picked.push(p));
  // 再补两段开头当背景（模型需要知道这门课讲到哪儿了）
  pool.slice(0, 2).forEach((p) => { if (picked.indexOf(p) < 0) picked.push(p); });

  // 🔴 自己先卡一道预算：fitContext 也会截，但截在这里能保证留下的是**相关**的段
  let budget = 3800;
  const out = [];
  for (const p of picked) {
    const line = "【《" + p.title + "》第 " + p.no + " 段】" + p.text;
    if (line.length > budget) break;
    out.push(line);
    budget -= line.length;
  }
  return out.join("\n");
}

/* ---------- 提示词 ---------- */
function askSystemPrompt() {
  const lines = [
    "你是一位大学计算机课程的答疑助教，正在回答学生关于下面这门课的问题。",
    "",
    "课程：" + (CUR_NAME || "（课程名未知）"),
    CW_LIST.length
      ? "本课共有 " + CW_LIST.length + " 份课件，其中与这一问相关的段落见「参考片段」。"
      : "这门课**还没有课件**。只依据公认的计算机知识回答；凡是涉及本课具体进度、老师要求、考核范围、教材页码的，直接说「课件里没有，建议问老师」。",
    "",
    "要求：",
    "1. 先给结论，再给推导或例子；能分点就分点。",
    "2. **只讲你确实知道的东西**：参考片段里没有的具体事实（页码、书名、老师的规定、考试范围）不要编，不确定就写「这一点课件里没有」。",
    "3. 代码用带语言名的代码块；复杂度用 O(·) 写清楚，别只写「很快」。",
    "4. 用中文、Markdown 排版，控制在 450 字以内 —— 学生要更细会继续追问。",
    "5. 不要复述问题，不要「好问题」这类客套，直接回答。",
  ];
  return lines.join("\n");
}

/* ---------- 渲染 ---------- */
const logEl = $("#chatLog");

function addMsg(who, text) {
  const isAI = who === "ai";
  const avatar = isAI ? "智" : escapeHtml(String(MY_NAME).slice(0, 1) || "我");
  const node = el(
    '<div class="msg ' + (isAI ? "ai" : "me") + '">' +
      '<div class="msg-avatar">' + avatar + '</div>' +
      '<div class="bubble">' + (isAI ? mdToHtml(text) : escapeHtml(text)) + '</div>' +
    '</div>'
  );
  if (!node) return null;
  logEl.appendChild(node);
  logEl.scrollTop = logEl.scrollHeight;
  return node;
}

/** 「系统说话」：没接模型 / 失败 / 已停止 —— 与助教回答分开，别让人误当答案 */
function addNotice(html) {
  const node = el(
    '<div class="msg sys">' +
      '<div class="msg-avatar">!</div>' +
      '<div class="bubble">' + html + '</div>' +
    '</div>'
  );
  if (!node) return null;
  logEl.appendChild(node);
  logEl.scrollTop = logEl.scrollHeight;
  return node;
}

/* 开场白 —— 接了模型是**正常回答气泡**；没接才是「系统说话」（警示样式）。
   ⚠️ 两条路的渲染不同：addMsg 走 mdToHtml（HTML 标签会被转义），
      所以接上模型那条用 Markdown 语法写；addNotice 才拼 HTML。 */
function greet() {
  if (!CUR_COURSE_ID) {
    addNotice("<b>还没有加入课堂。</b>" +
      "<p>点左侧「我的课程」右边的 ＋，输入老师给的邀请码就能进来。</p>");
    return;
  }
  if (!modelReadyNow()) {
    addNotice("<b>还没有接入模型</b>，所以现在提问不会得到回答 —— 我也不会拿预置的句子糊弄你。" +
      "<p>去「设置 → 模型接入」选一个服务商、填上自己的 API Key，回来再问，" +
      "我就能读本课课件现场作答。</p>");
    return;
  }
  const nm = modelName() || "你配置的模型";
  const md = CW_LIST.length
    ? "已接上 **" + nm + "**。这门课我读到了 " + CW_LIST.length + " 份课件（共 " +
      totalSections() + " 段），概念、代码、题目思路都可以问。\n\n" +
      "课件里没写的具体细节，我会直说没有，不去编。"
    : "已接上 **" + nm + "**，但《" + CUR_NAME + "》还没有课件 —— 我只能按通用的计算机知识回答；" +
      "涉及本课进度、老师要求、考核范围的，会如实说课件里没有。";
  addMsg("ai", md);
}

/* ============================================================
   推荐问题 —— 从本课课件正文里长出来
   ------------------------------------------------------------
   ⚠️ 以前这里是 3 条写死的数据结构问题，换了课程还照样显示，
      学生一看就知道跟自己的课没关系。现在有课件才给，且取的是课件里的原话。
   ============================================================ */
function shortSubject(sec) {
  const s = String(sec || "").replace(/\s+/g, " ").replace(/^[#>\-*\s]+/, "").trim();
  const first = (s.split(/[。！？；;]/)[0] || s).trim();
  return first.length > 18 ? first.slice(0, 18) + "…" : first;
}
function renderSuggests() {
  const box = $("#suggests");
  if (!box) return;

  if (!CW_LIST.length) {
    box.innerHTML = '<span class="field-hint">还没有课件 —— 直接问一句；' +
      '老师发课件之后，这里会按本课内容给几个能点的问法。</span>';
    return;
  }

  const picks = [];
  CW_LIST.forEach((cw) => {
    sectionList(cw).forEach((sec) => {
      if (picks.length >= 3) return;
      const q = shortSubject(sec);
      if (q && q.length >= 4 && picks.indexOf(q) < 0) picks.push(q);
    });
  });
  if (!picks.length) picks.push("这份课件的主要内容");

  box.innerHTML = picks.map((q) => {
    const ask = "请把「" + q + "」再讲一遍，换一种更容易懂的说法，并说清它为什么重要。";
    return '<button class="suggest" type="button" data-q="' +
      escapeHtml(ask).replace(/"/g, "&quot;") + '">再讲讲「' + escapeHtml(q) + '」</button>';
  }).join("");

  $$(".suggest", box).forEach((b) => {
    b.addEventListener("click", () => {
      $("#input").value = b.getAttribute("data-q") || b.textContent;
      send();
    });
  });
}

/* ============================================================
   发送 —— 真调模型
   ------------------------------------------------------------
   🔴 三条底线：
     1. 没接模型 → 如实说，**不生成任何答案**；
     2. 请求挂起 45 秒（llmChat 内建）或用户点「停止」→ 立即复位，按钮不能永久卡住；
     3. 失败把可操作的下一步写出来（Key 不对 / 额度用完 / CORS / 网络），别只说"出错了"。
   ============================================================ */
let turns = [];        // 交给模型的多轮历史（user / assistant）
let busy = false;
let aborter = null;

function pushTurn(role, content) {
  const c = String(content || "").trim();
  if (!c) return;
  turns.push({ role: role, content: c });
  if (turns.length > 12) turns = turns.slice(turns.length - 12);   // 只留最近 6 轮
}

function setBusy(on) {
  busy = !!on;
  const b = $("#sendBtn");
  if (!b) return;
  b.textContent = on ? "■" : "↑";
  b.title = on ? "停止" : "发送";
  b.setAttribute("aria-label", on ? "停止这次回答" : "发送");
  b.classList.toggle("stopping", !!on);
}

function showNoModel() {
  let why = "";
  try { why = (typeof llmStatusText === "function") ? llmStatusText() : ""; } catch (_) { /* 忽略 */ }
  addNotice(
    "<b>还没接模型，这一问不会生成回答。</b>" +
    "<p>" + escapeHtml(why || "去「设置 → 模型接入」选服务商并填上 API Key。") + "</p>" +
    "<p>接上之后我会读本课课件、按你的讲解偏好现场作答；答不出来的地方会直说，不编。</p>" +
    '<button class="btn btn-sm btn-primary" data-goto="settings.html" type="button">去设置 · 模型接入</button>'
  );
}

function askModel(text, label) {
  if (!modelReadyNow()) { showNoModel(); return; }

  const typing = el(
    '<div class="msg ai" id="typing">' +
      '<div class="msg-avatar">智</div>' +
      '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>' +
    '</div>'
  );
  if (typing) logEl.appendChild(typing);
  logEl.scrollTop = logEl.scrollHeight;

  setBusy(true);
  aborter = (typeof AbortController === "function") ? new AbortController() : null;

  const done = () => {
    if (typing && typing.parentNode) typing.parentNode.removeChild(typing);
    setBusy(false);
    aborter = null;
  };

  let pending;
  try {
    pending = llmChat(askSystemPrompt(), text, {
      retrieved: retrievedFor(text),
      history: turns.slice(0, -1),        // 本轮已 push，别重复
      maxTokens: 1400,
      temperature: 0.45,
      signal: aborter ? aborter.signal : null,
    });
  } catch (e) {
    done();
    addNotice("<b>这次没答上来。</b><p>" + escapeHtml(String((e && e.message) || e)) + "</p>");
    return;
  }

  pending.then((r) => {
    done();

    if (r && r.ok) {
      const node = addMsg("ai", r.raw);
      pushTurn("assistant", r.raw);
      attachFoot(node, label || text);

      const noteText = CW_LIST.length
        ? "按你的讲解偏好作答 · 依据本课课件"
        : "按你的讲解偏好作答 · 本课暂无课件";
      const bubble = node && node.querySelector ? node.querySelector(".bubble") : null;
      const note = el('<div class="ai-note">' + noteText + '</div>');
      if (bubble && note) bubble.insertBefore(note, bubble.firstChild);
      return;
    }

    if (r && r.aborted) {
      addNotice("已停止这次回答 —— 你可以接着说，或者换个问法。");
      return;
    }

    const err = (r && r.error) || "未知错误";
    const hint = (r && r.hint) || "";
    addNotice(
      "<b>这次没答上来。</b>" +
      "<p>" + escapeHtml(err) + "</p>" +
      (hint ? "<p>" + escapeHtml(hint) + "</p>" : "") +
      '<button class="btn btn-sm" data-goto="settings.html" type="button">去设置检查模型</button>'
    );
  }).catch((e) => {
    done();
    addNotice("<b>这次没答上来。</b><p>" + escapeHtml(String((e && e.message) || e)) + "</p>");
  });
}

/* 回答下方的操作栏 —— 每一栏都真的会再问一次模型（以前只是记一笔行为） */
const FOLLOW_UP = {
  deeper: "把刚才这回答的推导再展开讲一遍，每一步为什么成立都写出来。",
  code: "给一个能直接跑的最小代码例子，并说清关键那几行在做什么。",
  quiz: "就刚才这个知识点出 1 道小题来检验我懂没懂 —— 先只给题目，别给答案。",
};

function attachFoot(node, question) {
  const bubble = node && node.querySelector ? node.querySelector(".bubble") : null;
  if (!bubble) return;

  const foot = el(
    '<div class="bubble-foot">' +
      '<a href="#" data-act="deeper">展开推导</a>' +
      '<a href="#" data-act="code">看代码</a>' +
      '<a href="#" data-act="quiz">自测一题</a>' +
      '<a href="#" data-act="got">✓ 懂了</a>' +
    '</div>'
  );
  if (!foot) return;
  bubble.appendChild(foot);

  const links = foot.querySelectorAll ? foot.querySelectorAll("a[data-act]") : [];
  [].forEach.call(links, (a) => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      if (a.classList.contains("on")) return;      // 同一句回答不重复记 / 不重复问
      const act = a.getAttribute("data-act");

      if (act === "got") {
        rec("got", question, topicOf(question));
        a.classList.add("on");
        a.textContent = "✓ 已标记懂了";
        const t = el('<span class="foot-hint">已记入「我的学情」</span>');
        if (t) foot.appendChild(t);
        return;
      }

      // 🔴 上一轮还在跑时不再叠一条：两条请求会互相覆盖 aborter，
      //    「停止」只能停掉后面那条，前一条仍在后台跑。这一步在「记行为」之前 ——
      //    没发出去的追问不该被算成"要过推导"。
      if (busy) {
        addNotice("上一条还在回答 —— 等它出来，或者点发送按钮「■」停下再试。");
        return;
      }

      rec(act, question, topicOf(question));
      a.classList.add("on");

      const prompt = FOLLOW_UP[act];
      if (!prompt) return;
      if (!modelReadyNow()) {
        addNotice("这个追问要接上模型才能展开 —— 去「设置 → 模型接入」填上 Key 就行。");
        return;
      }
      addMsg("me", prompt);
      pushTurn("user", prompt);
      askModel(prompt, question);
    });
  });
}

/* ---------- 发送 ---------- */
function send() {
  const input = $("#input");
  if (!input) return;
  const text = input.value.trim();
  if (!text || busy) return;

  addMsg("me", text);
  pushTurn("user", text);
  rec("ask", text);              // 提问是最重要的一类行为：画像与学情都以它为基准

  input.value = "";
  input.style.height = "auto";

  askModel(text, text);
  if (input.focus) input.focus();
}

const sendBtn = $("#sendBtn");
if (sendBtn) {
  sendBtn.addEventListener("click", () => {
    if (busy) {
      if (aborter && aborter.abort) { try { aborter.abort(); } catch (_) { /* 已经结束 */ } }
      return;
    }
    send();
  });
}
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px";
});

/* 「去设置」「换服务商」这类按钮 —— 委托在容器上，内容换了也不用重绑 */
if (logEl) {
  logEl.addEventListener("click", (e) => {
    const b = (e.target && e.target.closest) ? e.target.closest("[data-goto]") : null;
    if (!b) return;
    e.preventDefault();
    goSettings();
  });
}
const modelHint = $("#modelHint");
if (modelHint) modelHint.addEventListener("click", goSettings);

$("#resetProfile").addEventListener("click", () => {
  if (!confirm("清空学习记录？\n\n风格画像与「我的学情」是同一份记录，清空后两处都会归零。" +
    "\n清掉之后就找不回来了。")) return;
  if (typeof clearBehavior === "function") clearBehavior();
  renderProfile();
});

/* ============================================================
   右栏「讲解风格画像」
   ------------------------------------------------------------
   🔴 这不再是写死的四条 —— 每一项都是**行为次数的比例**，并且把原始次数摊开写出来
      （「要例子 3 次 / 提问 12 次」），让人能自己核。不是模型判断，所以文案里
      不许出现"AI 认为你适合…"这类说法。
   ============================================================ */
function renderProfile() {
  const box = $("#traits");
  const meta = $("#profileMeta");
  const list = (typeof BEHAVIOR !== "undefined") ? BEHAVIOR : [];
  const sum = behaviorSummary(list, Date.now());
  const seeds = behaviorSeedCount(list);

  if (!sum.total) {
    box.innerHTML = '<p class="field-hint">还没有任何学习记录 —— 问第一句、或者去课件页写一条批注，' +
      '这里就会按你的真实行为统计出来。</p>';
    meta.textContent = "统计的是这几类行为的比例：要例子 / 要推导 / 要不要换个说法 / 听懂率 / 记笔记频率。";
    return;
  }

  const traits = behaviorTraits(list, Date.now());
  box.innerHTML = traits.map((t) => {
    const cls = t.score >= 50 ? "" : t.score >= 25 ? "mid" : "low";
    return '' +
    '<div class="trait">' +
      '<div class="trait-head"><b>' + t.name + '</b><span>' + (t.base ? t.label : "—") + '</span></div>' +
      '<div class="trait-bar"><div class="trait-fill ' + cls + '" style="width:' + Math.max(2, t.score) + '%"></div></div>' +
      '<div style="font-size:11.5px;color:var(--muted-foreground);margin-top:5px">' +
        (t.base ? t.count + " 次 / 提问 " + t.base + " 次" : "还没有提问，暂时没有基准") +
      '</div>' +
    '</div>';
  }).join("");

  meta.innerHTML =
    "这份画像来自 <b>" + sum.total + "</b> 条行为记录（提问 " + sum.byKind.ask + " 次、" +
    "批注 " + sum.byKind.note + " 条），共 " + sum.activeDays + " 天有记录" +
    (sum.streak > 1 ? "，已连续 " + sum.streak + " 天" : "") + "。<br>" +
    "是<b>行为比例的统计</b>，不是模型判断。" +
    (seeds === sum.total ? "<br>这份历史<b>全部是预置示例记录</b>（预置账号自带）。"
      : seeds ? "<br>其中 <b>" + seeds + "</b> 条是预置示例记录。" : "");
}

/* ---------- 启动 ---------- */
renderHead();
renderModelState();
greet();
renderSuggests();
renderProfile();
</script>
