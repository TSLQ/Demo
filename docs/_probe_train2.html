<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>probe train in shell</title></head>
<body style="font:13px/1.6 monospace;padding:16px">
<pre id="out">pending</pre>
<script>
localStorage.clear();
localStorage.setItem("st_accounts", JSON.stringify([
  { role: "teacher", user: "teacher", pass: "x", name: "李老师", createdAt: 1 },
  { role: "student", user: "student", pass: "x", name: "李同学", createdAt: 2 },
  { role: "student", user: "lisi", pass: "x", name: "李四", createdAt: 3 }
]));
localStorage.setItem("st_current_user", "student:student");
localStorage.setItem("st_a11y", JSON.stringify({ profile: "standard" }));

var log = [];
function push(s) { log.push(s); document.getElementById("out").textContent = log.join("\n"); }
const wait = (ms) => new Promise(r => setTimeout(r, ms));

(async function () {
  var f = document.createElement("iframe");
  f.id = "shellProbe";
  f.style.cssText = "width:1300px;height:760px;border:1px solid #999";
  f.src = "app.html";
  document.body.appendChild(f);
  await new Promise(r => { f.onload = r; });
  const S = f.contentWindow, SD = f.contentDocument;
  push("壳已加载；navigate=" + (typeof S.navigate) + " contentFrame=" + !!SD.getElementById("contentFrame"));

  const cf = SD.getElementById("contentFrame");
  cf.addEventListener("load", function () {
    try {
      const W = cf.contentWindow, D = cf.contentDocument;
      W.addEventListener("error", function (e) { push("内容页 ERR: " + e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno); });
      push("内容页=" + D.title + " btnNewAct=" + !!D.getElementById("btnNewAct"));
      const btn = D.getElementById("btnNewAct");
      if (!btn) { push("没有发起按钮"); return; }
      btn.click();
      setTimeout(function () {
        const host = D.getElementById("modalHost");
        push("点后 hidden=" + (host ? host.hidden : "无宿主") +
             " 子节点=" + (host ? host.children.length : "-") +
             " display=" + (host ? W.getComputedStyle(host).display : "-") +
             " 文本=" + (host ? JSON.stringify(host.textContent.replace(/\s+/g, " ").trim().slice(0, 60)) : "-"));
        const modal = host && host.querySelector(".modal");
        if (modal) {
          const r = modal.getBoundingClientRect();
          push("弹窗 x=" + Math.round(r.x) + " y=" + Math.round(r.y) + " w=" + Math.round(r.width) + " h=" + Math.round(r.height) +
               " 视口=" + W.innerWidth + "x" + W.innerHeight);
        } else { push("没有 .modal"); }
      }, 400);
    } catch (e) { push("读内容页失败: " + e.name + " " + e.message); }
  });

  try { cf.src = "training-student.html"; } catch (e) { push("设 src 失败: " + e.message); }
})();
</script>
</body></html>
