<!DOCTYPE html>
<html lang="zh-CN" data-role="student">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的作业 — 智课助教</title>
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/shell.css">
<!--
  ============================================================
  我的作业 —— 学生端接收老师发布的试卷并**在线作答提交**
  ------------------------------------------------------------
  与教师端「出题与组卷」（exam.html）+「学生管理」（stu.html）配成一条闭环：
    老师：圈章节 → AI 出题 → 逐题审核 → 组卷 → 发布到班级 → **看谁交了、得几分**
    学生：**在这里收到** → 作答 → **提交**

  🔴 四条硬规矩
   1. **跨账号桶读**（`examsForStudent`）—— 卷子记录在**老师**的桶里，
      学生自己的桶里没有；用 `examOf` 那种"只认本桶"的取法会什么都看不到。
   2. **提交记录存学生自己的桶**（`submitExamAnswer` → `st_exam_ans:<角色>:<账号>`），
      记录跟着产生它的人走；老师端跨桶读（`examAnsOfStudent`）。
   3. **学生端不显示参考答案与解析** —— 只显示"对 / 错"，答案在老师那边。
   4. ⚠️ **本架构下答案无法对学生真正隐藏**（纯静态，数据里就带着 `answer`）——
      所以这里的判分是"给自己看的学习反馈"，**不是防作弊的考试系统**，页面上如实说明。
  ============================================================
-->
<style>
  .hw-wrap { padding: 16px 18px 40px; box-sizing: border-box; }
  .hw-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .hw-stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 11px;
    padding: 10px 14px; min-width: 108px;
  }
  .hw-stat .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hw-stat .l { color: var(--muted-foreground); font-size: 12px; margin-top: 2px; }
  .hw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
  .hw-card {
    background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--primary);
    border-radius: 12px; padding: 14px 15px; display: flex; flex-direction: column; gap: 8px;
  }
  .hw-card.done { border-left-color: var(--success); }
  .hw-card h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
  .hw-meta { font-size: 12px; color: var(--muted-foreground); line-height: 1.6; }
  .hw-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .hw-chip {
    font-size: 11.5px; padding: 1px 8px; border-radius: 20px;
    background: var(--secondary); color: var(--muted-foreground);
  }
  .hw-chip.ok { background: var(--success-surface); color: var(--success); }
  .hw-chip.warn { background: var(--warning-surface); color: var(--warning); }
  .hw-acts { display: flex; gap: 7px; margin-top: auto; padding-top: 4px; }
  .hw-empty {
    text-align: center; color: var(--muted-foreground); font-size: 13px;
    padding: 40px 18px; border: 1px dashed var(--border); border-radius: 12px;
  }
  .hw-foot { color: var(--muted-foreground); font-size: 12px; line-height: 1.7; margin-top: 22px; }
  .hw-note {
    margin-top: 14px; padding: 10px 12px; border-radius: 9px; font-size: 12.5px; line-height: 1.6;
    background: var(--info-surface); border: 1px solid color-mix(in srgb, var(--info) 26%, transparent);
    color: var(--info-foreground);
  }
  /* ---------- 作答区 ---------- */
  .q-block { padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .q-block:last-child { border-bottom: 0; }
  .q-block h4 { margin: 0 0 6px; font-size: 13px; }
  .q-block.q-ok { background: var(--success-surface); border-radius: 9px; padding: 10px 10px; }
  .q-block.q-bad { background: var(--warning-surface); border-radius: 9px; padding: 10px 10px; }
  .q-block.q-pending { background: var(--info-surface); border-radius: 9px; padding: 10px 10px; }
  .q-mark { font-size: 11.5px; margin-left: 8px; font-weight: 500; }
  .q-mark.ok { color: var(--success); }
  .q-mark.bad { color: var(--warning); }
  .q-mark.pending { color: var(--info); }
  .q-text { font-size: 14px; line-height: 1.7; margin-bottom: 6px; }
  .q-opt { display: block; font-size: 13.5px; line-height: 1.9; cursor: pointer; }
  .q-opt input { margin-right: 7px; }
  .q-blanks { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .q-blank-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); }
  .q-input, .q-ta {
    font: inherit; font-size: 13.5px; padding: 5px 9px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--background); color: var(--foreground);
  }
  .q-input { min-width: 180px; flex: 1; }
  .q-ta { width: 100%; min-height: 66px; resize: vertical; box-sizing: border-box; }
  .hw-result {
    margin-top: 12px; padding: 10px 12px; border-radius: 9px; font-size: 13px; line-height: 1.65;
    background: var(--secondary); border: 1px solid var(--border);
  }

  /* ============================================================
     无障碍：导航层
     ------------------------------------------------------------
     不是「另一套界面」，是给同一份 DOM 补一张地图：
       skip link → 分区标题 → 跳转面板 → 焦点回落
     ============================================================ */
  .skip-link {
    position: fixed; left: 14px; top: -60px; z-index: 95;
    padding: 9px 14px; border-radius: 9px;
    background: var(--card); color: var(--foreground);
    border: 1px solid var(--border); box-shadow: var(--shadow-raised);
    font-size: 13px; text-decoration: none;
    transition: top .14s ease-out;
  }
  .skip-link:focus { top: 14px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .hw-head-row { display: flex; align-items: flex-start; gap: 16px; }
  .hw-head-row > div { flex: 1; min-width: 0; }
  .hw-jump {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    white-space: nowrap; margin-top: 2px;
  }
  .hw-kbd {
    font-size: 11px; padding: 1px 6px; border-radius: 5px;
    background: var(--secondary); color: var(--muted-foreground);
    border: 1px solid var(--border); font-variant-numeric: tabular-nums;
  }

  /* 分区标题：读屏靠它建「标题列表」，看得见的人也靠它扫读 */
  .hw-sec {
    margin: 20px 0 9px; font-size: 12.5px; font-weight: 500;
    color: var(--muted-foreground); letter-spacing: .04em;
  }
  #hwMain > .hw-sec:first-child { margin-top: 0; }
  #hwMain:focus, #hwStats:focus, #hwList:focus { outline: none; }

  /* ---------- 跳转面板 ---------- */
  #jpHost { position: relative; z-index: 70; }
  .jp-modal { width: min(480px, calc(100vw - 32px)); }
  .jp-hint { margin: 0; font-size: 12.5px; line-height: 1.7; color: var(--muted-foreground); }
  .jp-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .jp-item {
    width: 100%; display: flex; align-items: baseline; gap: 10px; text-align: left;
    padding: 10px 12px; border-radius: 9px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border);
    color: var(--foreground); font: inherit; font-size: 13.5px; line-height: 1.5;
    transition: background .12s, border-color .12s;
  }
  .jp-item:hover { background: var(--secondary); border-color: var(--muted-foreground); }
  .jp-lb { flex: 1; min-width: 0; }
  .jp-ht { flex: none; font-size: 11.5px; color: var(--muted-foreground); }
  .jp-foot { align-items: center; justify-content: space-between; gap: 10px; }
  .jp-echo-lab {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted-foreground); cursor: pointer;
  }

  /* 读屏回声条：给人看的观察窗，aria-hidden，不进 Tab 序 */
  .jp-echo-bar {
    position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 92;
    display: flex; align-items: center; gap: 9px;
    padding: 9px 13px; border-radius: 10px;
    background: var(--foreground); color: var(--background);
    font-size: 12.5px; line-height: 1.5; box-shadow: var(--shadow-raised);
  }
  .jp-echo-tag {
    flex: none; font-size: 10.5px; letter-spacing: .08em;
    padding: 1px 6px; border-radius: 4px;
    background: color-mix(in srgb, var(--background) 18%, transparent);
  }
  #jpEchoTxt { flex: 1; min-width: 0; }

  @media (max-width: 560px) {
    .hw-head-row { flex-direction: column; gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skip-link { transition: none; }
  }
</style>
</head>
<body>

<!-- 第一个可聚焦元素：键盘 / 读屏用户按一次 Tab 就能跳过整页导航 -->
<a class="skip-link" href="#hwMain">跳到主要内容</a>

<div class="page-wrap">
  <div class="page hw-wrap">
    <header class="page-head">
      <div class="crumb" id="hwCrumb">我的作业</div>
      <div class="hw-head-row">
        <div>
          <h1>我的作业</h1>
          <p>老师发布的试卷会出现在这里 —— 点开就能作答、提交。</p>
        </div>
        <button class="btn btn-sm hw-jump" id="jpOpen" type="button">
          跳到…<span class="hw-kbd">Alt + J</span>
        </button>
      </div>
    </header>

    <main id="hwMain" tabindex="-1">
      <h2 class="hw-sec" id="hwStatsTitle">提交进度</h2>
      <div class="hw-stats" id="hwStats"></div>

      <h2 class="hw-sec" id="hwListTitle">作业列表</h2>
      <div class="hw-grid" id="hwList"></div>

      <h2 class="hw-sec" id="hwNoteTitle">评分与说明</h2>
      <p class="hw-foot">
        这里显示的是老师发给你**自己**的卷子（按账号分开存，换个账号看到的是自己的）。
        <br>客观题（单选 / 多选 / 填空）提交后当场判分，简答题由老师批改 —— 只显示对错，不显示正确答案。
        <br>⚠️ 纯静态站里答案技术上无法对学生完全隐藏，这里的判分是给你自己看的学习反馈，不是防作弊的考试系统。
      </p>
    </main>
  </div>
</div>

<!-- 内容页自己的弹窗宿主（壳的 #modalHost 在 iframe 里取不到） -->
<div id="modalHost" hidden></div>

<!-- 跳转面板宿主（与看题弹窗分开，避免互相清空） -->
<div id="jpHost" hidden></div>

<!-- 读屏回声条：只是给看得见的人做观察用的，对读屏隐藏 -->
<div id="jpEchoBar" class="jp-echo-bar" aria-hidden="true" hidden>
  <span class="jp-echo-tag">读屏</span><span id="jpEchoTxt"></span>
</div>

<!-- 异步结果的播报通道：读屏不认「视觉上变了」，只认这里 -->
<div id="hwLive" class="sr-only" role="status" aria-live="polite"></div>

<script src="assets/nav.js"></script>
<script src="assets/core.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function me() { return (typeof currentUserKey === "function") ? currentUserKey() : ""; }
  function stamp(ts) {
    if (!ts) return "";
    if (typeof fmtStamp === "function") return fmtStamp(ts);
    var d = new Date(ts);
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }
  function typeLabel(t) { return (EXAM_TYPES[t] || EXAM_TYPES.short).label; }

  /** 选项文本 "A　前序…" → 字母 "A"；认不出来就按顺序给 A/B/C… */
  function optLetter(text, i) {
    var m = /^\s*([A-Za-z])\s*[、．.:：]?\s*[\u3000\s]/.exec(String(text) + " ");
    if (m) return m[1].toUpperCase();
    var m2 = /^\s*([A-Za-z])\s*[、．.:：]/.exec(String(text));
    if (m2) return m2[1].toUpperCase();
    return String.fromCharCode(65 + i);
  }

  /** 🔴 跨账号桶读「老师发给我的」—— 记录在老师的桶里 */
  function mine() {
    var u = me();
    if (!u) return [];
    return examsForStudent(u).slice().sort(function (a, b) {
      return (b.publishedAt || 0) - (a.publishedAt || 0);
    });
  }

  function render() {
    var list = mine();
    var u = me();

    var stats = $("hwStats");
    stats.innerHTML = "";
    var totalQ = 0, doneN = 0;
    list.forEach(function (e) {
      totalQ += examStats(e).accepted;
      if (myExamAnsOf(e.id)) doneN += 1;
    });
    [["待做", list.length - doneN], ["已交", doneN], ["题目", totalQ],
     ["课程", new Set(list.map(function (e) { return e.courseId; })).size]]
      .forEach(function (row) {
        var d = document.createElement("div");
        d.className = "hw-stat";
        var n = document.createElement("div");
        n.className = "n";
        n.textContent = row[1];
        var l = document.createElement("div");
        l.className = "l";
        l.textContent = row[0];
        d.appendChild(n); d.appendChild(l);
        stats.appendChild(d);
      });

    var box = $("hwList");
    box.innerHTML = "";

    if (!u) {
      var e0 = document.createElement("div");
      e0.className = "hw-empty";
      e0.textContent = "没有读到你的账号 —— 从登录页进来才会有作业。";
      box.appendChild(e0);
      return;
    }
    if (!list.length) {
      var e1 = document.createElement("div");
      e1.className = "hw-empty";
      e1.textContent = "老师还没发卷子给你。发了之后这里会自己出现（换个账号看，看到的是自己的）。";
      box.appendChild(e1);
      return;
    }

    list.forEach(function (ex) {
      var s = examStats(ex);
      var prev = myExamAnsOf(ex.id);
      var card = document.createElement("div");
      card.className = "hw-card" + (prev ? " done" : "");
      card.setAttribute("data-id", ex.id);

      var h = document.createElement("h3");
      h.textContent = ex.title || "未命名试卷";
      card.appendChild(h);

      var chips = document.createElement("div");
      chips.className = "hw-chips";
      [s.accepted + " 题", s.totalScore + " 分", s.duration + " 分钟"].forEach(function (t) {
        var c = document.createElement("span");
        c.className = "hw-chip";
        c.textContent = t;
        chips.appendChild(c);
      });
      if (prev) {
        var cD = document.createElement("span");
        cD.className = "hw-chip ok";
        cD.textContent = prev.pending
          ? "已交（客观题 " + prev.objectiveGot + "/" + prev.objectiveTotal + "）"
          : "已交 " + prev.objectiveGot + "/" + prev.objectiveTotal;
        chips.appendChild(cD);
      } else {
        var cN = document.createElement("span");
        cN.className = "hw-chip warn";
        cN.textContent = "未交";
        chips.appendChild(cN);
      }
      card.appendChild(chips);

      var meta = document.createElement("div");
      meta.className = "hw-meta";
      var by = (typeof accountDisplayName === "function") ? accountDisplayName(ex.createdBy) : "老师";
      meta.innerHTML = esc(ex.courseName || "（未指定课程）") + "<br>" +
        "由 " + esc(by) + " 发布 · " + esc(stamp(ex.publishedAt)) + "<br>" +
        "范围：" + esc((ex.chapters || []).map(function (c) { return c.title; }).join("、") || "—") +
        (prev ? "<br>上次提交：" + esc(stamp(prev.submittedAt)) + "（第 " + prev.attempts + " 次）" : "");
      card.appendChild(meta);

      var acts = document.createElement("div");
      acts.className = "hw-acts";
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-sm " + (prev ? "btn-ghost" : "btn-primary");
      b.textContent = prev ? "查看 / 重做" : "开始作答";
      b.setAttribute("data-act", "open");
      acts.appendChild(b);
      card.appendChild(acts);

      box.appendChild(card);
    });

    var c2 = curCourseName(list);
    $("hwCrumb").textContent = c2 || "我的作业";
  }

  function curCourseName(list) {
    var names = [];
    list.forEach(function (e) {
      var n = e.courseName || "";
      if (n && names.indexOf(n) < 0) names.push(n);
    });
    return names.length ? names.join(" / ") : "";
  }

  /** 每题渲染成一块可作答的控件（学生端**不显示答案**） */
  function questionBlock(q, i, prev) {
    var a = (prev && prev.answers) ? prev.answers[q.id] : null;
    var head = "<h4>" + (i + 1) + "．[" + typeLabel(q.type) + "]" +
      (q.point ? "　" + esc(q.point) : "") + "</h4>";
    var body = "";

    if (q.type === "single" || q.type === "multi") {
      var multi = q.type === "multi";
      var chosen = multi ? (Array.isArray(a) ? a : []) : [String(a || "")];
      body = '<div class="q-text">' + esc(q.text) + "</div>" +
        (multi ? '<div class="q-blanks">（多选：选全才算对）</div>' : "") +
        (q.options || []).map(function (opt, oi) {
          var letter = optLetter(opt, oi);
          var label = String(opt).replace(/^\s*[A-Za-z]\s*[、．.:：]?\s*[\u3000\s]*/, "");
          var ck = chosen.indexOf(letter) >= 0 ? " checked" : "";
          return '<label class="q-opt"><input type="' + (multi ? "checkbox" : "radio") +
            '" name="' + q.id + '" value="' + letter + '"' + ck + ">" +
            letter + "　" + esc(label) + "</label>";
        }).join("");
    } else if (q.type === "blank") {
      var n = (q.blanks && q.blanks.length) || 1;
      var arr = Array.isArray(a) ? a : [];
      var rows = "";
      for (var k = 0; k < n; k++) {
        rows += '<div class="q-blank-row"><span>第 ' + (k + 1) + ' 空</span>' +
          '<input class="q-input" type="text" data-blank="' + q.id + "-" + k + '" value="' +
          esc(arr[k] || "") + '"></div>';
      }
      body = '<div class="q-text">' + esc(q.text) + "</div>" +
        '<div class="q-blanks">（共 ' + n + ' 个空）' + rows + "</div>";
    } else {
      body = '<div class="q-text">' + esc(q.text) + "</div>" +
        '<textarea class="q-ta" data-q="' + q.id + '">' + esc(a || "") + "</textarea>";
    }

    return '<div class="q-block" data-qbox="' + q.id + '">' + head + body + "</div>";
  }

  /** 把 DOM 里的作答收集成 `{ qid: 值 }` */
  function collectAnswers(host, qs) {
    var ans = {};
    qs.forEach(function (q) {
      if (q.type === "single") {
        var r = host.querySelector('input[name="' + q.id + '"]:checked');
        ans[q.id] = r ? r.value : "";
      } else if (q.type === "multi") {
        var picked = [];
        var boxes = host.querySelectorAll('input[name="' + q.id + '"]');
        Array.prototype.forEach.call(boxes, function (el) { if (el.checked) picked.push(el.value); });
        ans[q.id] = picked;
      } else if (q.type === "blank") {
        var n = (q.blanks && q.blanks.length) || 1;
        var arr = [];
        for (var k = 0; k < n; k++) {
          var inp = host.querySelector('input[data-blank="' + q.id + "-" + k + '"]');
          arr.push(inp ? inp.value : "");
        }
        ans[q.id] = arr;
      } else {
        var ta = host.querySelector('textarea[data-q="' + q.id + '"]');
        ans[q.id] = ta ? ta.value : "";
      }
    });
    return ans;
  }

  /** 提交后逐题标对错（**只标对错、不给答案**） */
  function markResult(host, grade) {
    (grade.perQuestion || []).forEach(function (pq) {
      var box = host.querySelector('[data-qbox="' + pq.id + '"]');
      if (!box) return;
      box.classList.remove("q-ok", "q-bad", "q-pending");
      var mk = document.createElement("span");
      mk.className = "q-mark";
      if (!pq.graded) {
        box.classList.add("q-pending");
        mk.className += " pending";
        mk.textContent = pq.answered ? "已答 · 待老师批改" : "未作答";
      } else {
        box.classList.add(pq.ok ? "q-ok" : "q-bad");
        mk.className += pq.ok ? " ok" : " bad";
        mk.textContent = pq.ok ? "✓ 正确" : "✗ 错误";
      }
      var h = box.querySelector("h4");
      if (h) h.appendChild(mk);
    });
  }

  /** 作答 / 重做 —— 学生端不显示答案，只显示对错 */
  function openPaper(id) {
    var ex = null;
    var list = mine();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) ex = list[i];
    if (!ex) { render(); return; }

    // 记住是谁把弹窗叫出来的：关掉之后焦点要还回去
    var backTo = document.activeElement;

    var qs = (ex.questions || []).filter(function (q) { return q.state === "accepted"; });
    var prev = myExamAnsOf(ex.id);
    var host = (typeof pageModalHost === "function") ? pageModalHost() : $("modalHost");
    host.hidden = false;
    host.className = "modal-host";

    var head = '<p style="margin:0 0 4px;font-size:13px">' +
      esc(ex.courseName || "") + "　·　总分 " + ex.paper.totalScore + " 分　·　" + ex.paper.duration + " 分钟</p>" +
      '<p style="margin:0;font-size:12.5px;color:var(--muted-foreground)">范围：' +
      esc((ex.chapters || []).map(function (c) { return c.title; }).join("、") || "—") +
      (prev ? "　·　上次提交 " + esc(stamp(prev.submittedAt)) : "") + "</p>";

    var body = qs.length
      ? qs.map(function (q, i) { return questionBlock(q, i, prev); }).join("")
      : '<div class="hw-empty">这份卷子还没有采纳的题目。</div>';

    host.innerHTML =
      '<div class="modal hw-paper" role="dialog" aria-modal="true" aria-label="' + esc(ex.title) + '" style="max-width:680px">' +
        '<div class="modal-head"><b>' + esc(ex.title) + "</b></div>" +
        '<div class="modal-body">' + head + body +
          '<div class="hw-result" data-result' + (prev ? "" : " hidden") + ">" +
            (prev ? "你已提交（客观题 " + prev.objectiveGot + "/" + prev.objectiveTotal + " 分）—— 可改答案后重新提交。"
                  : "") +
          "</div>" +
          '<div class="hw-note">客观题（单选 / 多选 / 填空）提交后**当场判分**，简答由老师批改；' +
          "学生端**不显示正确答案**。⚠️ 纯静态站里答案技术上无法对学生完全隐藏 —— 这里是学习反馈，不是考试系统。</div>" +
        "</div>" +
        '<div class="modal-foot">' +
          '<button class="btn btn-ghost" data-mc="ok" type="button">关闭</button>' +
          (qs.length ? '<button class="btn btn-primary" data-mc="submit" type="button">' +
            (prev ? "重新提交" : "提交答卷") + "</button>" : "") +
        "</div>" +
      "</div>";
    document.body.classList.add("modal-open");

    if (prev) {
      // 打开就先按上次的结果标一遍（让"重做"时能看到上次对错）
      markResult(host, gradeExamPaper(ex, prev.answers));
    }

    // 弹窗开了就把焦点送进去：否则读屏还停在背后的卡片上，用户以为没反应
    var firstCtrl = host.querySelector(".modal-body input, .modal-body textarea, .modal-foot .btn");
    if (firstCtrl) firstCtrl.focus();

    function submit() {
      var answers = collectAnswers(host, qs);
      var r = submitExamAnswer(ex, answers);
      if (!r.ok) { flashErr(host, r.error); return; }
      markResult(host, r.grade);
      var box = host.querySelector("[data-result]");
      box.hidden = false;
      box.innerHTML = "<b>已提交。</b>客观题 " + r.grade.objectiveGot + " / " + r.grade.objectiveTotal + " 分" +
        (r.grade.pending ? "，另有 " + r.grade.pending + " 题简答待老师批改" : "") +
        "。已答 " + r.grade.answered + " / " + r.grade.questions + " 题。";
      var btn = host.querySelector('[data-mc="submit"]');
      if (btn) btn.textContent = "重新提交";
      host.querySelector(".modal-body").scrollTop = 0;
      // 🔴 视觉上「上面多了一行」读屏是听不见的 —— 必须显式播报
      jpAnnounce("已提交。客观题 " + r.grade.objectiveGot + " / " + r.grade.objectiveTotal + " 分" +
        (r.grade.pending ? "，另有 " + r.grade.pending + " 题简答待老师批改" : ""));
      render();     // 更新列表卡片上的"已交"状态
    }

    function flashErr(hostEl, msg) {
      var box = hostEl.querySelector("[data-result]");
      box.hidden = false;
      box.textContent = msg;
      box.style.color = "var(--warning)";
    }

    function close() {
      host.hidden = true; host.innerHTML = "";
      document.body.classList.remove("modal-open");
      host.removeEventListener("click", onClick);
      document.removeEventListener("keydown", onKey);
      // 焦点还给叫出弹窗的那个按钮；节点已经不在页面上了就别硬塞
      if (backTo && backTo.focus && document.contains(backTo)) backTo.focus();
    }
    function onClick(ev) {
      var b = ev.target.closest ? ev.target.closest("[data-mc]") : null;
      if (!b) { if (ev.target === host) close(); return; }
      var mc = b.getAttribute("data-mc");
      if (mc === "submit") submit();
      else close();
    }
    function onKey(ev) { if (ev.key === "Escape") close(); }
    host.addEventListener("click", onClick);
    document.addEventListener("keydown", onKey);
  }

  /* ============================================================
     无障碍导航层 —— 一张地图，不是第二套界面
     ------------------------------------------------------------
     面板读的是**同一份 DOM / 同一份数据**：任务项点击后直接调用
     openPaper() 或把焦点送到目标节点，没有平行的一份页面要维护。
     关闭一律把焦点还给触发它的按钮（焦点丢了 = 用户迷路）。
     ============================================================ */
  var jpBox = null;       // 面板宿主
  var jpItems = null;     // 本次打开的任务闭包
  var jpReturnTo = null;  // 关掉之后焦点回到谁
  var jpEcho = false;     // 回声条开关

  /** 播报：写进 aria-live 区，读屏才会念 */
  function jpAnnounce(msg) {
    var live = $("hwLive");
    if (!live) return;
    live.textContent = "";
    window.setTimeout(function () { live.textContent = msg; }, 40);
  }

  /** 把焦点送到一个非交互容器：补 tabindex=-1 才能 focus */
  function jpFocus(el) {
    if (!el) return;
    if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "-1");
    try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); }
    if (el.scrollIntoView) el.scrollIntoView({ block: "center" });
  }

  /** 这个元素读屏会念成什么 —— 只认常见几类，够用来观察 */
  function jpName(el) {
    if (!el || el === document.body || !el.getAttribute) return "";
    var s = el.getAttribute("aria-label") || "";
    if (s) return s;
    var ref = el.getAttribute("aria-labelledby");
    if (ref) {
      var n = document.getElementById(ref);
      if (n) return (n.textContent || "").replace(/\s+/g, " ").trim();
    }
    var tag = (el.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") {
      var lab = null;
      if (el.id) lab = document.querySelector('label[for="' + el.id + '"]');
      if (!lab && el.closest) lab = el.closest("label");
      var lb = lab ? (lab.textContent || "").replace(/\s+/g, " ").trim() : "";
      if (!lb) lb = el.getAttribute("placeholder") || "";
      var kind = tag === "textarea" ? "多行文本框"
        : (el.type === "checkbox" ? "复选框" : (el.type === "radio" ? "单选框" : "输入框"));
      return (lb ? lb + "，" : "") + kind;
    }
    var txt = (el.textContent || "").replace(/\s+/g, " ").trim();
    return txt.length > 40 ? txt.slice(0, 40) + "…" : txt;
  }

  /** 任务清单：按「我要做什么」排，不按页面上有什么排 */
  function jpTaskList() {
    var out = [];
    var list = mine();
    var todo = [], done = [];
    list.forEach(function (ex) { (myExamAnsOf(ex.id) ? done : todo).push(ex); });

    todo.slice(0, 3).forEach(function (ex) {
      out.push({
        lb: "开始作答：" + (ex.title || "未命名试卷"),
        ht: examStats(ex).accepted + " 题 · 未交",
        go: function () { openPaper(ex.id); }
      });
    });
    done.slice(0, 2).forEach(function (ex) {
      var p = myExamAnsOf(ex.id);
      out.push({
        lb: "看结果：" + (ex.title || "未命名试卷"),
        ht: p.pending ? "简答待批改" : ("客观 " + p.objectiveGot + "/" + p.objectiveTotal),
        go: function () { openPaper(ex.id); }
      });
    });
    out.push({ lb: "看我的提交进度", ht: "共 " + list.length + " 份", go: function () { jpFocus($("hwStats")); } });
    out.push({ lb: "跳到作业列表", ht: "全部试卷", go: function () { jpFocus($("hwList")); } });
    out.push({ lb: "看评分说明", ht: "判分边界", go: function () { jpFocus(document.querySelector(".hw-foot")); } });
    out.push({ lb: "回到课程列表", ht: "换门课", go: function () { if (typeof navigate === "function") navigate("class.html"); } });
    return out;
  }

  function jpHostEl() {
    if (!jpBox) jpBox = $("jpHost");
    return jpBox;
  }

  function jpOpen() {
    if (jpBox && !jpBox.hidden) return;
    jpReturnTo = document.activeElement;
    jpItems = jpTaskList();

    var rows = jpItems.map(function (it, i) {
      return '<li><button class="jp-item" type="button" data-jp="go" data-i="' + i + '">' +
        '<span class="jp-lb">' + esc(it.lb) + '</span>' +
        '<span class="jp-ht">' + esc(it.ht) + '</span></button></li>';
    }).join("");

    var box = jpHostEl();
    box.innerHTML =
      '<div class="modal-scrim" data-jp="close"></div>' +
      '<div class="modal jp-modal" role="dialog" aria-modal="true" aria-labelledby="jpTitle" aria-describedby="jpHint">' +
        '<div class="modal-head">' +
          '<h3 id="jpTitle">跳到…</h3>' +
          '<button class="modal-x" type="button" data-jp="close" aria-label="关闭">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<p class="jp-hint" id="jpHint">↑ ↓ 选，回车前往，Esc 关掉。清单按「你要做什么」排，不按区块排。</p>' +
          '<ul class="jp-list" role="list">' + rows + '</ul>' +
        '</div>' +
        '<div class="modal-foot jp-foot">' +
          '<label class="jp-echo-lab"><input type="checkbox" id="jpEcho"' +
            (jpEcho ? " checked" : "") + '> 显示读屏会念的内容</label>' +
          '<button class="btn btn-sm btn-ghost" type="button" data-jp="close">关闭</button>' +
        '</div>' +
      '</div>';

    box.hidden = false;
    document.body.classList.add("modal-open");
    var first = box.querySelector(".jp-item");
    if (first) first.focus();
  }

  function jpClose(back) {
    var box = jpBox;
    if (!box || box.hidden) return;
    box.hidden = true;
    box.innerHTML = "";
    jpItems = null;
    document.body.classList.remove("modal-open");
    if (back !== false && jpReturnTo && jpReturnTo.focus) jpReturnTo.focus();
  }

  function jpRun(i) {
    var it = jpItems && jpItems[i];
    if (!it) return;
    jpClose(false);
    window.setTimeout(function () { it.go(); }, 0);
  }

  function jpFocusables(box) {
    return Array.prototype.slice.call(
      box.querySelectorAll(".jp-item, .modal-x, #jpEcho, .jp-foot .btn")
    );
  }

  function jpOnKey(ev) {
    var box = jpBox;
    if (!box || box.hidden) return;

    if (ev.key === "Escape") { ev.preventDefault(); jpClose(true); return; }

    // 焦点陷阱：Tab 只在面板里转，转到最后一格回到第一格
    if (ev.key === "Tab") {
      var f = jpFocusables(box);
      if (!f.length) return;
      var at = f.indexOf(document.activeElement);
      if (ev.shiftKey && at <= 0) { ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && at === f.length - 1) { ev.preventDefault(); f[0].focus(); }
      return;
    }

    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      var its = Array.prototype.slice.call(box.querySelectorAll(".jp-item"));
      var cur = its.indexOf(document.activeElement);
      if (cur < 0) return;
      ev.preventDefault();
      var next = ev.key === "ArrowDown" ? Math.min(cur + 1, its.length - 1) : Math.max(cur - 1, 0);
      its[next].focus();
    }
  }

  function jpBind() {
    var box = jpHostEl();
    if (!box) return;

    box.addEventListener("keydown", jpOnKey);

    box.addEventListener("click", function (ev) {
      var el = ev.target.closest ? ev.target.closest("[data-jp]") : null;
      if (!el) return;
      var act = el.getAttribute("data-jp");
      if (act === "close") { jpClose(true); return; }
      if (act === "go") jpRun(parseInt(el.getAttribute("data-i"), 10));
    });

    box.addEventListener("change", function (ev) {
      if (!ev.target || ev.target.id !== "jpEcho") return;
      jpEcho = !!ev.target.checked;
      var bar = $("jpEchoBar");
      if (!bar) return;
      bar.hidden = !jpEcho;
      var t = $("jpEchoTxt");
      if (t) t.textContent = jpEcho ? "（关掉面板后用 Tab 走一遍页面，这里显示读屏会念什么）" : "";
    });

    var btn = $("jpOpen");
    if (btn) btn.addEventListener("click", function () { jpOpen(); });

    // Alt + J：随时呼出 / 收起
    document.addEventListener("keydown", function (ev) {
      if (!(ev.altKey && (ev.key === "j" || ev.key === "J"))) return;
      ev.preventDefault();
      if (jpBox && !jpBox.hidden) { jpClose(true); return; }
      if (document.body.classList.contains("modal-open")) return;
      jpOpen();
    });

    // 回声条跟着焦点走
    document.addEventListener("focusin", function (ev) {
      var bar = $("jpEchoBar");
      if (!bar || bar.hidden) return;
      var t = $("jpEchoTxt");
      if (t) t.textContent = jpName(ev.target) || "—";
    });
  }

  jpBind();

  $("hwList").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!b) return;
    var card = ev.target.closest ? ev.target.closest("[data-id]") : null;
    if (!card) return;
    if (b.getAttribute("data-act") === "open") openPaper(card.getAttribute("data-id"));
  });

  /* ---------- 给 AI 指令条注册这一页能做的事 ----------
     ⚠️ 只读 / 跳转的直接做；改数据的动作必须带 diff，由 Deck 弹审核。
        这里三条都不改数据，所以不进审核，只负责「把人送到地方」。 */
  if (window.Deck && typeof window.Deck.register === "function") {
    window.Deck.register([
      {
        id: "hw.openFirst",
        label: "开始作答第一份未交的卷子",
        sample: "开始做作业",
        risk: "nav",
        leave: true,
        match: function (t) {
          if (!/(开始|做|答|写).*(作业|卷子|试卷)/.test(t)) return null;
          var all = mine();
          for (var i = 0; i < all.length; i++) {
            if (!myExamAnsOf(all[i].id)) return { id: all[i].id };
          }
          return { id: "" };
        },
        run: function (a) {
          if (a && a.id) { openPaper(a.id); return; }
          jpFocus($("hwList"));
          if (typeof announce === "function") announce("现在没有未交的卷子，下面是全部作业。");
        }
      },
      {
        id: "hw.progress",
        label: "看提交进度",
        sample: "看我交了几份",
        risk: "read",
        leave: true,
        match: function (t) {
          return /(提交进度|交了几份|做了几份|进度)/.test(t) ? {} : null;
        },
        run: function () { jpFocus($("hwStats")); }
      },
      {
        id: "hw.list",
        label: "跳到作业列表",
        sample: "列出我的作业",
        risk: "read",
        leave: true,
        match: function (t) {
          return /(作业列表|列出.*作业|有哪些作业)/.test(t) ? {} : null;
        },
        run: function () { jpFocus($("hwList")); }
      }
    ]);
  }

  render();
})();
</script>
</body>
</html>
