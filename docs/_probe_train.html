<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>probe train</title></head>
<body style="font:13px/1.6 monospace;padding:16px">
<pre id="out">pending</pre>
<script>
localStorage.clear();
localStorage.setItem("st_accounts", JSON.stringify([
  { role: "teacher", user: "teacher", pass: "x", name: "李老师", createdAt: 1 },
  { role: "student", user: "student", pass: "x", name: "李同学", createdAt: 2 },
  { role: "student", user: "lisi", pass: "x", name: "李四", createdAt: 3 }
]));
localStorage.setItem("st_current_user", "student:student");
localStorage.setItem("st_a11y", JSON.stringify({ profile: "standard" }));

var log = [];
function push(s) { log.push(s); document.getElementById("out").textContent = log.join("\n"); }
const wait = (ms) => new Promise(r => setTimeout(r, ms));

(async function () {
  var f = document.createElement("iframe");
  f.style.cssText = "width:1200px;height:700px;border:1px solid #999";
  f.src = "training-student.html";
  document.body.appendChild(f);
  await new Promise(r => { f.onload = r; });
  const W = f.contentWindow, D = f.contentDocument;

  W.addEventListener("error", function (e) { push("ERR: " + e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno); });
  push("已加载；btnNewAct=" + !!D.getElementById("btnNewAct") + " pageModalHost=" + (typeof W.pageModalHost) + " modalHost=" + !!D.getElementById("modalHost"));

  const btn = D.getElementById("btnNewAct");
  btn.click();
  await wait(300);
  const host = D.getElementById("modalHost");
  push("点后：hidden=" + (host ? host.hidden : "无宿主") +
       " 子节点=" + (host ? host.children.length : "-") +
       " 文本=" + (host ? JSON.stringify(host.textContent.replace(/\s+/g, " ").trim().slice(0, 80)) : "-") +
       " 计算display=" + (host ? W.getComputedStyle(host).display : "-") +
       " zIndex=" + (host ? W.getComputedStyle(host).zIndex : "-"));
  const modal = host && host.querySelector(".modal");
  if (modal) {
    const r = modal.getBoundingClientRect();
    push("弹窗盒子 x=" + Math.round(r.x) + " y=" + Math.round(r.y) + " w=" + Math.round(r.width) + " h=" + Math.round(r.height) +
         " 可见=" + (r.width > 0 && r.height > 0) + " position=" + W.getComputedStyle(modal).position);
  } else {
    push("没有 .modal 节点");
  }

  const goal = D.getElementById("mkGoal");
  if (goal) {
    goal.value = "为什么快排平均更快，还要学冒泡和归并？";
    const mk = D.getElementById("mkCreate");
    mk.click();
    await wait(500);
    const listT = D.getElementById("stList") ? D.getElementById("stList").textContent.replace(/\s+/g, " ").trim() : "(没有 stList)";
    push("发起后：modal hidden=" + host.hidden + " 列表=" + JSON.stringify(listT.slice(0, 90)));
    push("存档键=" + Object.keys(localStorage).filter(k => k.indexOf("st_activities") === 0).join(","));
  } else {
    push("没有 #mkGoal —— 弹窗没渲染出来");
  }
})();
</script>
</body></html>
