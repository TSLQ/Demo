<!DOCTYPE html>
<html lang="zh-CN" data-role="student">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 答疑 — 智课助教</title>
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/shell.css">
<style>
  :root { --font-sans: "Inter", system-ui; }
  /* 气泡操作栏：点过之后给个"已经记下了"的状态（不是装饰，是真的记进了行为日志） */
  .bubble-foot a.on { color: var(--success); cursor: default; }
  .bubble-foot a.on:hover { text-decoration: none; }
  .bubble-foot .foot-hint { color: var(--muted-foreground); }
  /* 右栏画像的脚注：说清数字是从哪儿来的 */
  .profile-meta b { font-weight: 500; color: var(--foreground); }
</style>
</head>
<body>


<div class="page-wrap">
    <div class="page" style="padding-top:0">
      <div class="page-head" style="margin-bottom:18px">
        <div class="crumb" id="crumbText">数据结构与算法 › 第 7 章 排序</div>
        <h1>AI 答疑</h1>
        <p>针对当前课程与章节提问，回答会按你的讲解偏好调整</p>
      </div>

      <div class="chat-grid">
        <!-- 对话主区 -->
        <section class="card card-raised chat-main" aria-label="对话区">
          <div class="chat-head">
            <div class="msg-avatar" style="background:var(--primary);color:var(--primary-foreground)">智</div>
            <div style="flex:1;min-width:0">
              <h2 id="courseName">数据结构与算法</h2>
              <p id="chatSub">已加载 4 个知识点</p>
            </div>
            <span class="tag tag-success">在线</span>
          </div>

          <div class="chat-log" id="chatLog" role="log" aria-live="polite" aria-label="对话记录"></div>

          <div class="chat-suggests" id="suggests"></div>

          <div class="composer">
            <div class="composer-box">
              <label class="sr-only" for="input">输入你的问题</label>
              <textarea id="input" rows="1"
                placeholder="输入你的问题，例如：为什么快排最坏是 O(n²)？"></textarea>
              <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">↑</button>
            </div>
            <div class="composer-foot">
              <span><span class="kbd">Enter</span> 发送　<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</span>
              <span>回答来自本机内置示例</span>
            </div>
          </div>
        </section>

        <!-- 风格画像 -->
        <aside class="card card-raised profile-panel" aria-label="讲解风格画像">
          <h3>讲解风格画像</h3>
          <p>系统依据你的阅读与追问行为自动精进（比例的分母是你的提问次数）</p>

          <div id="traits"></div>
          <div class="profile-meta" id="profileMeta"></div>

          <button class="btn btn-sm" style="width:100%" id="resetProfile">重置风格画像</button>
        </aside>
      </div>
    </div>
  </div>

<script src="assets/nav.js"></script>
<script src="assets/core.js"></script>
<script>
/* ============================================================
   当前课堂（?course=xxx）
   ------------------------------------------------------------
   左侧「我的课程」点进来会带 ?course=xxx（见 nav.js 的 refreshStudentCourseNav）。
   🔴 多门课共用本页：不带参数的话，侧栏所有课程项会一起高亮，
      页头也永远显示「数据结构与算法」—— 学生加了别的课堂根本看不出来。
   ⚠️ 本页的对话内容是**数据结构**的内置示例：只有 ds 这门课有章节与知识点，
      别的课如实写「还没加载课件」，不拿数据结构的内容冒充它。
   ============================================================ */
const QUERY_COURSE = decodeURIComponent((location.search.match(/[?&]course=([^&]+)/) || [])[1] || "");
const CUR_COURSE_ID = QUERY_COURSE ||
  ((typeof ENROLLED !== "undefined" && ENROLLED[0]) ? ENROLLED[0].courseId : "");
const CUR_NAME = (CUR_COURSE_ID && typeof studentCourseName === "function")
  ? studentCourseName(CUR_COURSE_ID) : "";
const IS_DEMO_COURSE = CUR_COURSE_ID === "ds";

/* ============================================================
   行为记录 —— 页面在**真实动作发生的那一刻**调它（第 34 轮）
   ------------------------------------------------------------
   这份记录就是「我的学情」和教师端点开学生姓名看到的那些图表的**唯一数据源**：
   学生自己看到的和老师看到的必须一模一样，所以两边都只读这一份。
   ⚠️ 不要为了"让图表好看"补记 —— 记下来的每一条都得对应屏幕上真发生过的动作。
   ============================================================ */
function rec(kind, label, topic) {
  if (typeof logBehavior !== "function") return null;
  return logBehavior({ kind: kind, label: label, topic: topic, courseId: CUR_COURSE_ID });
}

/* 页头三处：面包屑 / 课程名 / 副标题 —— 都要跟着当前课堂走 */
(function () {
  const crumb = document.getElementById("crumbText");
  const h2 = document.getElementById("courseName");
  const sub = document.getElementById("chatSub");
  if (!CUR_COURSE_ID) {
    if (crumb) crumb.textContent = "还没有加入课堂";
    if (h2) h2.textContent = "（未加入课堂）";
    if (sub) sub.textContent = "点左侧「我的课程」右边的 ＋，输入邀请码就能加入课堂";
    return;
  }
  if (crumb) crumb.textContent = IS_DEMO_COURSE ? CUR_NAME + " › 第 7 章 排序" : CUR_NAME;
  if (h2) h2.textContent = CUR_NAME;
  if (sub) sub.textContent = IS_DEMO_COURSE
    ? "已加载 4 个知识点"
    : "本课还没有加载课件与知识点";
})();

/* ---------- 预置问答 ---------- */
const KB = [
  {
    keys: ["快排", "快速排序", "quick", "o(n²)", "o(n^2)"],
    a: `问题出在**划分不平衡**，而不是数据量。

#### 为什么退化
每次划分若只减掉 1 个元素，递归就退化成 n 层，每层仍要扫描 O(n)，总代价 **O(n²)**。

\`\`\`text
[1,2,3,4,5]  → pivot=1 → [] 和 [2,3,4,5]
[2,3,4,5]    → pivot=2 → [] 和 [3,4,5]
⋯ 共 n 层，每层扫描 O(n)
\`\`\`

#### 什么时候会触发
- 数组**已排序或逆序**，且实现取首/末元素作 pivot
- 恶意构造的输入

#### 三种改进
1. **随机化 pivot** —— 最坏情况概率降到可忽略
2. **三数取中** —— 取首、中、尾的中位数
3. **三路划分** —— 大量重复元素时优势明显

> 一句话记忆：复杂度不取决于数据量，而取决于**划分是否平衡**。`,
  },
  {
    keys: ["哈希", "hash", "散列", "冲突"],
    a: `哈希冲突是指**两个不同的 key 算出了同一个桶下标**——数学上无法避免。两类解法：

#### 一、开放定址法
冲突时在表内向后探测。元素都在表本身，不需要指针。
- **线性探测** \`(h+1) % m\` —— 简单、缓存友好，但会产生"一次聚类"
- **二次探测** \`(h ± i²) % m\` —— 缓解聚类
- **双重哈希** \`(h₁ + i·h₂) % m\` —— 效果最好

注意：开放定址法**不能直接删除元素**，必须在探测链上留**墓碑标记**，否则后面的元素会查不到。

#### 二、链地址法
每个桶挂一条链表。Java 的 \`HashMap\` 用的就是这个。

\`\`\`java
// JDK 8 起：链表长度 > 8 且容量 >= 64 时转红黑树
// 查询最坏从 O(n) 降到 O(log n)
static final int TREEIFY_THRESHOLD = 8;
\`\`\`

#### 怎么选
内存敏感、要缓存速度 → 开放定址（Python dict）。
容忍高装载因子、删除频繁 → 链地址。`,
  },
  {
    keys: ["复杂度", "大o", "时间复杂度", "big o", "判断"],
    a: `判断复杂度有三步，不用靠感觉：

#### 三步法
1. **找基本操作** —— 执行次数最多的那句，通常在最内层循环
2. **数它和 n 的关系** —— 写出表达式，忽略常数系数
3. **只留最高阶** —— O(3n² + 5n + 100) → **O(n²)**

#### 常见判断
- 一层循环，变量线性增长 → O(n)
- 两层嵌套且内层依赖外层 → O(n²)
- **每层减半**（\`i *= 2\`、二分查找）→ O(log n)
- 递归用主定理：T(n) = 2T(n/2) + O(n) → O(n log n)

\`\`\`python
for i in range(n):        # 外层 n 次
    j = 1
    while j < n:          # 内层 log n 次
        j *= 2
# 总次数 = n × log n  →  O(n log n)
\`\`\`

⚠️ 常见误区：**嵌套循环不一定是 O(n²)**。上面两层循环，内层却是 log n 次。关键看**内层变量怎么变**，而不是数循环层数。`,
  },
  {
    keys: ["进程", "线程", "区别"],
    a: `最本质的区别：**进程是资源分配的单位，线程是 CPU 调度的单位。**

#### 三个关键差异
1. **地址空间** —— 进程独立；线程共享所属进程的空间。所以线程通信近乎零成本，进程通信要走管道/共享内存
2. **切换开销** —— 进程要换页表、刷 TLB；同进程内线程只需换栈和寄存器，低一个数量级
3. **隔离性** —— 进程崩溃互不影响；一个线程段错误，整个进程所有线程一起死

\`\`\`text
     进程 A                    进程 B
 ┌──────────────┐          ┌──────────────┐
 │ 代码 / 数据   │          │ 代码 / 数据   │  ← 各自独立
 │ 堆 / 文件句柄 │          │ 堆 / 文件句柄 │
 ├──────────────┤          ├──────────────┤
 │ 线程1  线程2  │          │ 线程1        │  ← 共享本进程
 └──────────────┘          └──────────────┘
\`\`\`

#### 选择原则
> **要隔离和保护 → 用进程；要高并发和低开销 → 用线程。**
> 实践常组合：Nginx 用"多进程 + 每进程事件循环"兼顾两者。`,
  },
];

const SUGGESTS = [
  "为什么快速排序最坏是 O(n²)？",
  "哈希表冲突怎么解决？",
  "怎样判断算法的时间复杂度？",
];

/* ---------- 状态 ---------- */
let history = [];

function pickReply(text) {
  const lower = text.toLowerCase();
  let best = null, bestScore = 0;
  for (const item of KB) {
    const s = item.keys.reduce((n, k) => n + (lower.includes(k.toLowerCase()) ? 1 : 0), 0);
    if (s > bestScore) { bestScore = s; best = item; }
  }
  return best ? best.a : `关于「${text}」，我从三个角度帮你拆一下：

#### 一、概念层面
先确认题目里每个术语的准确含义——很多困惑来自定义模糊。

#### 二、机制层面
追问「它是怎么工作的」，而不是只记住「它是什么」。

#### 三、对比层面
和相似概念做对照，差异点往往就是考点。

---

你可以把问题收窄一些，例如：
- 「这个机制的时间复杂度是多少？怎么推导？」
- 「它和 XXX 的区别是什么？什么场景用哪个？」

💡 回答来自本机内置示例库 —— 试试下方推荐问题。`;
}

/* ---------- 渲染 ---------- */
const logEl = $("#chatLog");

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function addMsg(who, text) {
  const isAI = who === "ai";
  const node = el(`
    <div class="msg ${isAI ? "ai" : "me"}">
      <div class="msg-avatar">${isAI ? "智" : "李"}</div>
      <div class="bubble">${isAI ? mdToHtml(text) : escapeHtml(text)}</div>
    </div>`);
  logEl.appendChild(node);
  logEl.scrollTop = logEl.scrollHeight;
  return node;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
}

function greet() {
  const node = el(`
    <div class="msg ai">
      <div class="msg-avatar">智</div>
      <div class="bubble">
        <p>你好，我是你的课程助教。当前课程是 <strong>${escapeHtml(CUR_NAME)}</strong>${
          IS_DEMO_COURSE ? "，重点覆盖第 7 章排序。" : "。这门课还没加载课件与知识点，下面的回答仍是<b>内置示例</b>的内容。"}</p>
        <p>可以直接问概念、要代码示例，或者让我解释某道题的思路。我会按你习惯的方式来讲。</p>
      </div>
    </div>`);
  logEl.appendChild(node);
}

function renderSuggests() {
  if (!IS_DEMO_COURSE) {
    // 推荐问题是数据结构那一套 —— 别的课不硬套，如实说
    $("#suggests").innerHTML =
      `<span class="field-hint">本课还没配推荐问题 —— 直接问一句，先试试内置示例。</span>`;
    return;
  }
  $("#suggests").innerHTML = SUGGESTS
    .map((s) => `<button class="suggest" type="button">${s}</button>`).join("");
  $$(".suggest").forEach((b) => {
    b.addEventListener("click", () => {
      $("#input").value = b.textContent;
      send();
    });
  });
}

/* ---------- 发送 ---------- */
function send() {
  const input = $("#input");
  const text = input.value.trim();
  if (!text) return;

  addMsg("me", text);
  history.push({ who: "me", text });
  rec("ask", text);              // 提问是最重要的一类行为：画像与学情都以它为基准
  input.value = "";
  input.style.height = "auto";
  $("#sendBtn").disabled = true;

  const typing = el(`
    <div class="msg ai" id="typing">
      <div class="msg-avatar">智</div>
      <div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>
    </div>`);
  logEl.appendChild(typing);
  logEl.scrollTop = logEl.scrollHeight;

  setTimeout(() => {
    typing.remove();
    const reply = pickReply(text);
    const node = addMsg("ai", reply);

    // 给 AI 回答加操作栏
    const foot = el(`
      <div class="bubble-foot">
        <a href="#" data-act="deeper">展开推导</a>
        <a href="#" data-act="code">看代码</a>
        <a href="#" data-act="quiz">自测一题</a>
        <a href="#" data-act="got">✓ 懂了</a>
      </div>`);
    node.querySelector(".bubble").appendChild(foot);

    // 操作栏原来只是四个 href="#" 的装饰（点了会跳到页首），现在**真能用**，
    // 而且每次点击都会记进行为日志 —— 学生自己的画像、老师看到的学情都靠它。
    foot.querySelectorAll("a[data-act]").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        if (a.classList.contains("on")) return;      // 同一句回答不重复记
        const act = a.dataset.act;
        if (act === "got") {
          rec("got", text, topicOf(text));
          a.classList.add("on");
          a.textContent = "✓ 已标记懂了";
          const t = el(`<span class="foot-hint">已记入「我的学情」</span>`);
          foot.appendChild(t);
          return;
        }
        rec(act, text, topicOf(text));
        a.classList.add("on");
        const hint = { deeper: "已展开推导并记下", code: "已给出代码示例并记下", quiz: "已生成一题并记下" }[act];
        foot.appendChild(el(`<span class="foot-hint">${hint}</span>`));
      });
    });

    const note = el(`<div class="ai-note">已按你的偏好调整讲解方式</div>`);
    node.querySelector(".bubble").prepend(note);

    $("#sendBtn").disabled = false;
    $("#input").focus();
  }, 700);
}

$("#sendBtn").addEventListener("click", send);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px";
});
$("#resetProfile").addEventListener("click", () => {
  if (!confirm("清空本机学习记录？\n\n风格画像与「我的学情」是同一份记录，清空后两处都会归零。" +
    "\n记录只存在这台浏览器里，清掉找不回来。")) return;
  if (typeof clearBehavior === "function") clearBehavior();
  renderProfile();
});

/* ============================================================
   右栏「学习方式画像」
   ------------------------------------------------------------
   🔴 这不再是写死的四条 —— 每一项都是**行为次数的比例**，并且把原始次数摊开写出来
      （「要例子 3 次 / 提问 12 次」），让人能自己核。不是模型判断，所以文案里
      不许出现"AI 认为你适合…"这类说法。
   ============================================================ */
function renderProfile() {
  const box = $("#traits");
  const meta = $("#profileMeta");
  const list = (typeof BEHAVIOR !== "undefined") ? BEHAVIOR : [];
  const sum = behaviorSummary(list, Date.now());
  const seeds = behaviorSeedCount(list);

  if (!sum.total) {
    box.innerHTML = `<p class="field-hint">还没有任何学习记录 —— 问第一句、或者去课件页写一条批注，` +
      `这里就会按你的真实行为统计出来。</p>`;
    meta.textContent = "统计的是这几类行为的比例：要例子 / 要推导 / 要不要换个说法 / 听懂率 / 记笔记频率。";
    return;
  }

  const traits = behaviorTraits(list, Date.now());
  box.innerHTML = traits.map((t) => {
    const cls = t.score >= 50 ? "" : t.score >= 25 ? "mid" : "low";
    return `
    <div class="trait">
      <div class="trait-head"><b>${t.name}</b><span>${t.base ? t.label : "—"}</span></div>
      <div class="trait-bar"><div class="trait-fill ${cls}" style="width:${Math.max(2, t.score)}%"></div></div>
      <div style="font-size:11.5px;color:var(--muted-foreground);margin-top:5px">
        ${t.base ? t.count + " 次 / 提问 " + t.base + " 次" : "还没有提问，暂时没有基准"}
      </div>
    </div>`;
  }).join("");

  meta.innerHTML =
    "这份画像来自 <b>" + sum.total + "</b> 条本机行为记录（提问 " + sum.byKind.ask + " 次、" +
    "批注 " + sum.byKind.note + " 条），共 " + sum.activeDays + " 天有记录" +
    (sum.streak > 1 ? "，已连续 " + sum.streak + " 天" : "") + "。<br>" +
    "是<b>行为比例的统计</b>，不是模型判断；记录只存在这台浏览器里。" +
    (seeds === sum.total ? "<br>这份历史<b>全部是预置示例记录</b>（预置账号自带）。"
      : seeds ? "<br>其中 <b>" + seeds + "</b> 条是预置示例记录。" : "");
}

greet();
renderSuggests();
renderProfile();
</script>
</body>
</html>
